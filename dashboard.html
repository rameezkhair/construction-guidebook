          s += `<path d="M${mx - 6} ${y + 1}h12l-6 8z" fill="${col}" stroke="var(--bg)" stroke-width="1"><title>${esc(fmtD(l.date) + ' ' + l.mom + ' · ' + l.type + (l.critical === 'Yes' ? ' (critical)' : '') + ': ' + l.text)}</title></path>`;
        }
        if (lx + 30 < x1) s += `<text x="${lx}" y="${y + rowH / 2 + 4}" font-size="11.5" font-weight="700" fill="var(--ink)">${act}%</text>`;
      }
    });
    if (msLane) {
      const y = top + D.wbs.length * rowH + 22;
      s += `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="0" y="${y + 4}" font-size="12.5" font-weight="700" fill="var(--ink)">Milestones</text>`;
      let lastLx = -99;
      [...D.milestones].sort((p, q) => (dt(p.actual) || dt(p.forecast) || dt(p.baseline)) - (dt(q.actual) || dt(q.forecast) || dt(q.baseline))).forEach(m => {
        const st = msStatus(m), b0 = dt(m.baseline), e0 = dt(m.actual) || dt(m.forecast) || b0; if (!isFinite(b0)) return;
        const col = st[1] === 'good' ? 'var(--good)' : st[1] === 'warn' ? 'var(--warn)' : 'var(--bad)';
        if (isFinite(e0) && Math.abs(e0 - b0) > DAY) s += `<line x1="${X(b0)}" x2="${X(e0)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2" stroke-dasharray="3 2"/><path d="M${X(b0)} ${y - 6}l6 6-6 6-6-6z" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
        s += `<path d="M${X(e0)} ${y - 8}l8 8-8 8-8-8z" fill="${col}" stroke="var(--bg)" stroke-width="1.5"><title>${esc(m.id + ' ' + m.name)}: baseline ${fmtD(m.baseline)}, ${m.actual ? 'actual ' + fmtD(m.actual) : 'forecast ' + fmtD(m.forecast || m.baseline)} (${st[0]})</title></path>`;
        if (!small && X(e0) - lastLx > 24) { lastLx = X(e0); s += `<text x="${X(e0)}" y="${y + 20}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(m.id)}</text>`; }
      });
    }
    if (mtLane) {
      const y = top + D.wbs.length * rowH + msLane + 20;
      s += `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="0" y="${y + 4}" font-size="12.5" font-weight="700" fill="var(--ink)">Meetings</text>`;
      for (const m of D.meetings) {
        const t = dt(m.date); if (!isFinite(t)) continue;

        s += `<circle cx="${X(t)}" cy="${y}" r="7" fill="${crit ? 'var(--bad)' : 'var(--c-ev)'}" stroke="var(--bg)" stroke-width="2"><title>${esc(m.ref + ' · ' + fmtD(m.date) + ' · ' + items.length + ' items' + (crit ? ', open critical items' : ''))}</title></circle>`;
        if (!small) s += `<text x="${X(t)}" y="${y + 20}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(m.ref)}</text>`;
      }
    }
    const dx = X(tnow);
    s += `<line x1="${dx}" x2="${dx}" y1="${top - 6}" y2="${H - 4}" stroke="var(--hv)" stroke-width="2"/><text x="${dx}" y="${top - 9}" font-size="10.5" text-anchor="middle" fill="var(--hvink)" font-weight="700">Data date</text>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="height:${H}px">${s}</svg>`;
  }
  function drawIpc(el) {
    const W = el.clientWidth, H = el.clientHeight, p = D.ipcs; if (!W) return; if (!p.length) return empty(el, 'Add IPCs below.');

    const gw = (W - m.l - m.r) / p.length, bw = Math.min(20, gw / 4.2), y = v => H - m.b - (H - m.t - m.b) * Math.max(0, v) / max;

  function drawCash(el) {

    const small = W < 520, m = { l: 58, r: 28, t: 12, b: 26 }, max = niceMax(Math.max(...all.map(q => q[1]), ...net.map(q => q[1]), 1));
    const x = i => m.l + (ms.length === 1 ? (W - m.l - m.r) / 2 : (W - m.l - m.r) * i / (ms.length - 1)), y = v => H - m.b - (H - m.t - m.b) * v / max;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${yAxis(W, H, m, max)}${lineSeries(all, x, y, 'var(--c-ac)')}${lineSeries(net, x, y, 'var(--c-ev)')}${lineSeries(paid, x, y, 'var(--c-pa)')}${xLabels(ms, x, H, small)}</svg>`;

  const CHARTS = { scurve: drawScurve, idx: drawIdx, gantt: drawGantt, ipc: drawIpc, cash: drawCash, cpm: drawCpm, manpower: drawManpower };

  // ---------- editors ----------
  function editor(k) {

  // ---------- render ----------
  const VIEWS = { overview: vOverview, schedule: vSchedule, meetings: vMeetings, resources: vResources, contract: vContract, payments: vPayments, interfaces: vInterfaces, risks: vRisks, settings: vSettings };
  function drawCharts() {

    root.querySelectorAll('[data-chart]').forEach(el => { const f = CHARTS[el.dataset.chart]; let w = 0; const ro = new ResizeObserver(() => { if (el.clientWidth !== w) { w = el.clientWidth; f(el); } }); ro.observe(el); ros.push(ro); f(el); });

      <div class="dtabs" role="tablist">${TABS.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}</div>

  function setVal(t) {

  function msg(where, s) { const m = root.querySelector(`[data-msg="${where}"]`); if (m) m.textContent = s; }
  function setPending(t) {
    if (!pending) return false;
    if (t.dataset.pm) { pending[t.dataset.pm] = t.value; return true; }
    if (t.dataset.pk) {
      const it = pending.items[+t.dataset.pi], k = t.dataset.pk;
      it[k] = k === 'include' ? t.checked : ['value', 'days'].includes(k) ? num(t.value) : t.value;
      if (k === 'include') t.closest('tr').classList.toggle('off', !t.checked);
      return true;
    }
    return false;
  }
  function setDoc(t) {
    if (!docPend) return false;
    if (t.dataset.dm) { docPend[t.dataset.dm] = t.type === "checkbox" ? t.checked : t.value; return true; }
    if (t.dataset.dk) { const r = docPend.rows[+t.dataset.di], k = t.dataset.dk; r[k] = k === "include" ? t.checked : t.value; if (k === "include") t.closest("tr").classList.toggle("off", !t.checked); return true; }
    return false;
  }
  function onInput(e) { if (!setPending(e.target) && !setDoc(e.target)) setVal(e.target); }
  function onChange(e) {
    const t = e.target;
    if (setPending(t) || setDoc(t)) return;
    if (t.hasAttribute('data-momreview')) { D.project.momReview = t.checked; save(); return; }
    const KIND = { 'wbs-file': 'wbs', 'prog-file': 'prog', 'tender-file': 'tender', 'boq-file': 'boq' };
    if (KIND[t.dataset.act] && t.files.length) { const f = t.files[0]; t.value = ''; processDoc(KIND[t.dataset.act], f); return; }
    if (t.dataset.act === 'proj-switch') { switchTo(t.value); return; }
    if (t.dataset.act === 'mom-file' && t.files.length) { queue.push(...t.files); t.value = ''; processNext(); setMomMsg(); return; }
    if (t.dataset.act === 'import' && t.files[0]) {
      t.files[0].text().then(txt => { const d = JSON.parse(txt); if (!d.project || !Array.isArray(d.wbs)) throw 0; for (const k of Object.keys(SCHEMA)) if (!Array.isArray(d[k])) d[k] = []; D = d; save(); render(); msg('settings', 'Data imported.'); })
        .catch(() => msg('settings', 'That file is not a dashboard export.'));
      return;
    }
    if (t.closest('[data-form]')) return;
    if (setVal(t)) { if (t.dataset.k === 'code' && t.dataset.t === 'wbs') render(); else refresh(); }
  }
  function onClick(e) {
    const b = e.target.closest('button'); if (!b || !root.contains(b) || b.closest('form')) return;
    if (b.dataset.tab) { tab = b.dataset.tab; render(); return; }
    if (b.dataset.add) { const k = b.dataset.add; e.preventDefault(); openEd.add(k); D[k].push(Object.fromEntries(SCHEMA[k].cols.map(c => [c[0], c[2] === 'n' ? 0 : c[2] === 's' ? c[3][0] : c[2] === 'd' ? D.project.dataDate : '']))); save(); render(); return; }
    if (b.dataset.del) { e.preventDefault(); D[b.dataset.del].splice(+b.dataset.i, 1); save(); render(); return; }
    const a = b.dataset.act;
    const pmsg = s => { const m = root.querySelector('[data-msg="proj"]'); if (m) m.textContent = s; };
    if (a === 'proj-save') { save(); pmsg(savedAt.startsWith('Saved') ? `${savedAt}. Project "${D.project.name}" is stored in this browser.` : savedAt); return; }
    if (a === 'proj-new') { showNew = true; render(); const i = root.querySelector('[data-form="newp"] input[name=name]'); if (i) i.focus(); return; }
    if (a === 'proj-cancel') { showNew = false; render(); return; }
    if (a === 'proj-copy') { D = JSON.parse(JSON.stringify(D)); D.project.name = (D.project.name || 'Project') + ' (copy)'; projId = newId(); save(); render(); pmsg(`Saved as a new project: ${D.project.name}`); return; }
    if (a === 'proj-del') {
      if (!delArm) { delArm = projId; render(); pmsg(`Click "Confirm delete" to remove "${D.project.name}" from this browser. Export it first if you may need it.`); setTimeout(() => { if (delArm) { delArm = ''; if (root.isConnected) render(); } }, 6000); return; }
      const ix = index(), gone = D.project.name;
      try { localStorage.removeItem(PKEY(projId)); } catch (e) {}
      for (const m of D.meetings) Mom.delFile(m.id);
      ix.list = ix.list.filter(p => p.id !== projId); ix.current = ix.list[0] ? ix.list[0].id : ''; writeIndex(ix); delArm = '';
      D = load(); render(); pmsg(`Deleted "${gone}".`); return;
    }
    if (a === 'mom-paste') {
      const ta = root.querySelector('[data-mom-text]'), txt = ta ? ta.value.trim() : '';
      if (!txt) { momBusy = 'Paste the minutes text first.'; setMomMsg(); return; }
      const p = Object.assign(Mom.parse(txt, 'Pasted text', D.wbs), { fileName: 'Pasted text', file: null, text: txt });
      if (autoMode()) { staged.push(p); ta.value = ''; commitStaged(); return; }
      suggestFollow(p.items); pending = p;
      momBusy = `${p.items.length} items found in the pasted text. Review them below.`; render(); return;
    }
    if (a === 'mom-save') { commitPending(); return; }
    if (a && a.startsWith('doc-paste-')) { const ta = root.querySelector('[data-doc-text]'), txt = ta ? ta.value.trim() : ''; if (!txt) { docBusy = 'Paste the document text first.'; setDocMsg(); return; } readDoc(a.slice(10), txt, 'Pasted text'); return; }
    if (a === 'doc-apply') { applyDoc(); return; }
    if (a === 'doc-discard') { docPend = null; docBusy = 'Discarded.'; render(); return; }
    if (a === 'mom-discard') { pending = null; momBusy = 'Discarded.'; render(); processNext(); return; }
    if (a === 'mom-open') { Mom.openStored(b.dataset.id).catch(err => { momBusy = err.message; setMomMsg(); }); return; }
    if (a === 'mom-del') {
      const id = b.dataset.id;
      if (momDelArm !== id) { momDelArm = id; render(); setTimeout(() => { if (momDelArm === id) { momDelArm = ''; if (root.isConnected) render(); } }, 6000); return; }
      const m = D.meetings.find(x => x.id === id);
      D.meetings = D.meetings.filter(x => x.id !== id); D.log = D.log.filter(l => l.meetingId !== id); Mom.delFile(id); momDelArm = '';
      save(); momBusy = `Deleted ${m ? m.ref : 'meeting'} and its log items. PCOs it created were kept; remove them on the Risks & changes tab if needed.`; render(); return;
    }
    if (a === 'export') {
      const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' }), l = document.createElement('a');
      l.href = URL.createObjectURL(blob); l.download = (String(D.project.name || 'project').replace(/[^\w-]+/g, '-').toLowerCase()) + '-dashboard.json'; document.body.appendChild(l); l.click(); l.remove();
      msg('settings', 'Exported. Keep the file safe; import it on any computer.');
    } else if (a === 'reset') { D = sample(); save(); render(); msg('settings', 'Sample data restored.'); }
    else if (a === 'clear') { D = { project: { name: 'My project', currency: D.project.currency, contract: 0, retention: 5, dataDate: new Date().toISOString().slice(0, 10) } }; for (const k of Object.keys(SCHEMA)) D[k] = []; save(); render(); msg('settings', 'Blank project started. Begin with the WBS baseline on the Schedule & progress tab.'); }
  }
  function onSubmit(e) {
    const np = e.target.closest('[data-form="newp"]');
    if (np) {
      e.preventDefault(); const fd = new FormData(np), name = String(fd.get('name') || '').trim() || 'New project';
      D = fd.get('start') === 'sample' ? Object.assign(sample(), {}) : blank(name, String(fd.get('currency') || 'AED'));
      D.project.name = name; D.project.currency = String(fd.get('currency') || D.project.currency);
      projId = newId(); showNew = false; pending = null; queue = []; save(); tab = 'schedule'; render();
      const m = root.querySelector('[data-msg="proj"]'); if (m) m.textContent = `Created "${name}". Start with the WBS baseline below, then milestones and progress.`;
      return;
    }
    const f = e.target.closest('[data-form="log"]'); if (!f) return;
    e.preventDefault();
    const fd = new FormData(f), code = fd.get('code'), date = fd.get('date');
    let p = fd.get('pct'); if (p === 'other') p = fd.get('custom');
    p = Math.max(0, Math.min(100, num(p)));
    if (!code || !date) return msg('log', 'Choose a WBS element and a date.');
    const ex = D.progress.find(x => String(x.code) === String(code) && x.date === date);
    if (ex) ex.pct = p; else D.progress.push({ date, code, pct: p });
    D.progress.sort((a, b) => dt(a.date) - dt(b.date) || String(a.code).localeCompare(String(b.code)));
    save(); render(); msg('log', `Logged ${wbsLabel(code)} at ${p}% on ${fmtD(date)}.`);
  }
  function onToggle(e) { const d = e.target; if (d.dataset && d.dataset.ed) { d.open ? openEd.add(d.dataset.ed) : openEd.delete(d.dataset.ed); } }

  return {
    mount(el) {
      root = el; D = load(); syncContract();
      el.addEventListener('input', onInput); el.addEventListener('change', onChange); el.addEventListener('click', onClick);
      el.addEventListener('submit', onSubmit); el.addEventListener('toggle', onToggle, true);
      el.addEventListener('dragover', e => { const z = e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
      el.addEventListener('dragleave', e => { const z = e.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
      el.addEventListener('dragover', e => { const z = e.target.closest('[data-drop-kind]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
      el.addEventListener('drop', e => { const k = e.target.closest('[data-drop-kind]'); if (k) { e.preventDefault(); k.classList.remove('over'); if (e.dataTransfer.files[0]) processDoc(k.dataset.dropKind, e.dataTransfer.files[0]); return; } });
      el.addEventListener('drop', e => { const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.remove('over'); if (e.dataTransfer.files.length) { queue.push(...e.dataTransfer.files); processNext(); setMomMsg(); } });
      render();
    },
    unmount() { ros.forEach(r => r.disconnect()); ros = []; },
  };
})();

</script>
<script>{ Dash.mount(document.getElementById('dash')); }</script>
</body>
