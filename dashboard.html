<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project dashboard · Construction Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a site engineer's reference: direct, practical, calm; tables do the work.
   IDEA: a drawing set. Each page is a numbered sheet with a title block; home is the master programme.
   PICTURE: the master programme as a Gantt on blueprint, six phase bars with stage gates, clickable.
   COLOUR and TYPE: blueprint blue band, white sheets, hi-vis orange only for focus phases and the active item; Archivo throughout.
   LAYOUT: sticky top bar with search; drawing register (nav) left, sheet right; stacks under 900px. */
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#0b1220);--ink:light-dark(#12213b,#e7edf7);--muted:light-dark(#4a5a75,#a3b3ca);
  --line:light-dark(#d8dfe9,#24334d);--th:light-dark(#eef3fb,#131f37);--link:light-dark(#0b4fc4,#8fb9ff);
  --bp:light-dark(#0f3f8f,#0c2c66);--bp2:light-dark(#0b3274,#09224f);--hv:#ff6b1a;--hvink:light-dark(#b84300,#ff9a5c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Archivo,system-ui,sans-serif;overflow-x:clip}
a{color:var(--link);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--hv);outline-offset:2px}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px max(4vw,16px);background:var(--bp2);color:#fff}
@media(min-width:900px){.top{position:sticky;top:0;z-index:5}}
.brand{display:flex;gap:10px;align-items:center;color:#fff;text-decoration:none;font-weight:800;font-size:17px;line-height:1.2;margin-right:auto}
.brand svg{flex:none}
.top input{width:min(340px,100%);height:44px;border-radius:8px;border:1px solid #ffffff55;background:#ffffff14;color:#fff;font:inherit;font-size:16px;padding:0 14px}
.top input::placeholder{color:#d6e2ff}
.hero{background:var(--bp);color:#fff;padding:clamp(28px,4vw,56px) max(5vw,16px);
  background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:28px 28px}
.hero-in{max-width:1240px;margin:0 auto;display:grid;gap:clamp(20px,3vw,40px);grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:center}
.hero h1{font-size:clamp(32px,4.4vw,52px);line-height:1.05;margin:0 0 14px;font-weight:800;text-wrap:balance}
.hero p{margin:0 0 10px;color:#dfe8ff;max-width:52ch}
.hero .go{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;margin-top:10px;border-radius:8px;background:var(--hv);color:#1a0d00;font-weight:700;text-decoration:none}
.fig{position:relative;min-height:400px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig a text{cursor:pointer}.fig a:hover rect.bar{filter:brightness(1.12)}
.hero .go.alt{background:transparent;color:#fff;border:1.5px solid #fff;margin-left:8px}
@media(max-width:900px){.hero-in{grid-template-columns:minmax(0,1fr)}}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px;padding:28px max(4vw,16px) 64px}
nav.reg{font-size:14.5px;line-height:1.35}
@media(min-width:900px){nav.reg{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;padding-right:8px}}
nav.reg summary{display:none}
nav.reg h4{margin:18px 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
nav.reg h4:first-of-type{margin-top:0}
nav.reg a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
nav.reg a:hover{background:var(--th)}
nav.reg a[aria-current]{border-left-color:var(--hv);background:var(--th);font-weight:700}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.reg{border:1px solid var(--line);border-radius:10px;padding:0 12px}
  nav.reg summary{display:flex;align-items:center;min-height:48px;font-weight:700;cursor:pointer}
  nav.reg:not([open])>div{display:none}nav.reg>div{padding-bottom:12px}}
.sheet{max-width:900px}
.tblock{display:flex;flex-wrap:wrap;border:1.5px solid var(--ink);font-size:13px;margin-bottom:22px}
.tblock span{padding:6px 12px;border-right:1px solid var(--ink)}.tblock span:last-child{border-right:0;margin-left:auto}
.tblock b{font-weight:700}
article h1{font-size:clamp(28px,3.6vw,40px);line-height:1.1;margin:0 0 14px;text-wrap:balance}
article h2{font-size:24px;line-height:1.2;margin:40px 0 12px;padding-top:14px;border-top:2px solid var(--ink)}
article h3{font-size:18.5px;line-height:1.3;margin:28px 0 8px}
article p,article li{max-width:72ch}
article ul,article ol{padding-left:22px}article li{margin:4px 0}
li.task{list-style:none;margin-left:-22px}li.task label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
li.task input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--hv)}
.lede{font-size:17px;color:var(--muted)}
.tw{overflow-x:auto;margin:14px 0 20px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
th{background:var(--th);text-align:left;font-weight:700;vertical-align:bottom}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.wide table{min-width:900px}.wide td:first-child{font-weight:400}
code{font-size:.92em;background:var(--th);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{overflow-x:auto;background:var(--th);padding:14px;border-radius:8px}
pre.mermaid{background:transparent;border:1px solid var(--line);text-align:center;font-size:12px}
pre.mermaid:not([data-processed]){text-align:left;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--th)}.note{color:var(--muted);font-size:14px}
.pn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:48px}
.pn a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);min-height:44px}
.pn a:hover{border-color:var(--ink)}.pn small{display:block;color:var(--muted);font-size:13px}
.pn .next{text-align:right;grid-column:2}
.res{list-style:none;padding:0}.res li{padding:14px 0;border-bottom:1px solid var(--line);max-width:none}
.res a{font-weight:700;font-size:17px}.res p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
mark{background:#ffd9c2;color:#1a0d00;border-radius:2px}
footer{border-top:1px solid var(--line);padding:20px max(4vw,16px);font-size:13px;color:var(--muted);text-align:center}
@media(prefers-reduced-motion:no-preference){.bar{transition:filter .15s}}
/* Dashboard */
:root{--c-pv:light-dark(#7d8aa3,#8494b0);--c-ev:light-dark(#0b4fc4,#6ea8ff);--c-ac:#ff6b1a;--c-ap:light-dark(#b9c6dc,#3a4d70);--c-ce:light-dark(#0b4fc4,#6ea8ff);--c-pa:light-dark(#0f8a5f,#3ccf91);
  --good:light-dark(#0f8a5f,#3ccf91);--warn:light-dark(#b26a00,#f0b14a);--bad:light-dark(#c0362c,#ff7b6e)}
main.full{max-width:none}
.dtabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin:6px 0 18px}
.dtabs button{min-height:44px;padding:0 18px;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px}
.dtabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--hv)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-top:4px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}.kpi b{font-size:clamp(22px,2.4vw,28px);line-height:1.15;font-variant-numeric:tabular-nums}.kpi small{font-size:13px;color:var(--muted)}
.kpi.good{border-top-color:var(--good)}.kpi.warn{border-top-color:var(--warn)}.kpi.bad{border-top-color:var(--bad)}
.kpi.good b{color:var(--good)}.kpi.bad b{color:var(--bad)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px}.card.span2{grid-column:1/-1}
.card h3{margin:0 0 4px;font-size:17px}.cap{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
@media(max-width:760px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dfig{min-height:280px}.dfig.sm{min-height:220px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center;margin-bottom:6px}
.legend span{white-space:nowrap}.lg{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.lg.pv{background:repeating-linear-gradient(90deg,var(--c-pv) 0 6px,transparent 6px 9px)}.lg.ev{background:var(--c-ev)}.lg.ac{background:var(--c-ac)}
.lg.ap{background:var(--c-ap);height:10px}.lg.ce{background:var(--c-ce);height:10px}.lg.pa{background:var(--c-pa);height:10px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}.wl{font-size:14px;line-height:1.3}.wl small{display:block;color:var(--muted);font-size:12.5px}
.track{position:relative;height:14px;background:var(--th);border-radius:7px}
.fill{height:100%;border-radius:7px}.fill.ok{background:var(--good)}.fill.slip{background:var(--warn)}.fill.late{background:var(--bad)}
.mark{position:absolute;top:-4px;width:3px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-1.5px)}
.heat{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:6px;max-width:360px}
.hy{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;color:var(--muted);text-align:center}
.hx{grid-column:2;text-align:center;font-size:12px;color:var(--muted)}
.hg{display:grid;grid-template-columns:20px repeat(5,minmax(0,1fr));gap:4px}
.hl{font-size:12px;color:var(--muted);display:grid;place-items:center}
.hc{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#1a1a1a;opacity:.45}.hc.has{opacity:1}
.hz1,.sc.hz1{background:#cfe9d9}.hz2,.sc.hz2{background:#ffd98a}.hz3,.sc.hz3{background:#ff9c8f}
.sc{display:inline-block;min-width:30px;text-align:center;border-radius:4px;padding:1px 6px;font-weight:700;color:#1a1a1a}
.prow{display:grid;grid-template-columns:110px minmax(0,1fr) 84px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.prow b{text-align:right;font-variant-numeric:tabular-nums}.prow small{color:var(--muted)}
.st-potential{background:var(--c-ap)}.st-submitted{background:var(--warn)}.st-approved{background:var(--good)}.st-rejected{background:var(--bad);opacity:.6}
table.mini{font-size:13.5px}.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.pform label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.pform input,table.ed input,table.ed select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;min-height:40px;padding:4px 8px;width:100%}
table.ed{min-width:720px}table.ed td{padding:4px;border-bottom:1px solid var(--line)}table.ed td:first-child{font-weight:400}table.ed th{font-size:13px}
table.ed input.r{text-align:right}table.ed td:nth-child(2) input:not(.r){min-width:240px}
.x{width:40px;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--bad);font-size:20px;cursor:pointer}
.btn.sm{min-height:42px;padding:0 14px;font-size:14.5px}.acts{display:flex;flex-wrap:wrap;gap:8px}.file{display:inline-flex;align-items:center}
.dbody .card+.card{margin-top:0}.dbody>.card{margin-bottom:16px}
:root{--c-bl:light-dark(#dbe3ef,#2a3a57)}
.dtabs{overflow-x:auto;scrollbar-width:thin}.dtabs button{flex:none;white-space:nowrap}
.dfig.auto{min-height:0}.dfig.auto>svg{position:static;display:block;width:100%}
.lg.bl{background:var(--c-bl);height:10px}.lg.ok{background:var(--good);height:10px}.lg.late{background:var(--bad);height:10px}.lg.dd{background:var(--hv);width:3px;height:14px}
.lg.ok2{background:var(--c-pa)}.lg.pe{background:var(--warn);height:10px}
.lg.mx-late,.lg.mx-open,.lg.mx-agreed,.lg.mx-done{width:14px;height:14px;border-radius:3px}
.mx-late{background:#ff9c8f}.mx-open{background:#ffd98a}.mx-agreed{background:#b9d3ff}.mx-done{background:#bfe6cf}
table.mx{width:auto;min-width:100%;font-size:13px}table.mx th{font-weight:600;white-space:nowrap}table.mx tbody th{background:var(--th)}
table.mx td{text-align:center;font-weight:800;min-width:56px;color:#1a1a1a;border-left:1px solid var(--line)}table.mx td.mx-self{background:repeating-linear-gradient(45deg,var(--th) 0 4px,transparent 4px 8px)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;color:#1a1a1a}
.tag.good{background:#bfe6cf}.tag.warn{background:#ffd98a}.tag.bad{background:#ff9c8f}.tag.info{background:#b9d3ff}
.dview{margin-bottom:16px}.dedit .card{margin-bottom:12px}
details.edit>summary{cursor:pointer;font-weight:700;min-height:28px;display:flex;align-items:center;gap:8px}details.edit>summary small{color:var(--muted);font-weight:400}
details.edit[open]>summary{margin-bottom:8px}
.logf{margin-bottom:16px;border-color:var(--hv);border-width:1.5px}
.lrow{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.lrow>label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.lrow select,.lrow input[type=date],.lrow input[type=number]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;min-height:44px;padding:4px 8px}
.lrow input[type=number]{width:80px}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip input{position:absolute;opacity:0;pointer-events:none}.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:8px;color:var(--ink);font-weight:700;cursor:pointer}
.chip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip input:focus-visible+span{outline:3px solid var(--hv);outline-offset:2px}
.prow.wide{grid-template-columns:150px minmax(0,1fr) 84px}
.stackbar{display:flex;height:100%;border-radius:7px;overflow:hidden}.stackbar i{display:block;height:100%}
@media(max-width:600px){.prow,.prow.wide{grid-template-columns:96px minmax(0,1fr) 70px}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 10px;padding-inline-start:calc(8em + 10px);text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;font-weight:700;color:var(--muted);font-size:12px}.stack td:empty{display:none}.tblock span:last-child{margin-left:0}}
/* App shell: section switch between Guidebook and Project dashboard */
.appnav{display:flex;gap:4px;flex-wrap:wrap}
.appnav a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:8px;color:#dfe8ff;text-decoration:none;font-weight:700;font-size:15px}
.appnav a:hover{background:#ffffff1a;color:#fff}
.appnav a[aria-current=page]{background:#fff;color:var(--bp2)}
.dashwrap{max-width:1400px;margin:0 auto;padding:24px max(4vw,16px) 64px}
.dashwrap main,.dashwrap #dash{max-width:none}
/* Search definitions */
.defs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;margin:10px 0 24px}
.def{border:1px solid var(--line);border-left:4px solid var(--hv);border-radius:8px;padding:14px 16px}
.def h3{margin:0 0 2px;font-size:18px}.def .where{margin:0 0 8px;font-size:13px;color:var(--muted)}
.def dl{margin:0;display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:4px 12px;font-size:14.5px}
.def dt{font-weight:700;color:var(--muted);font-size:13px;padding-top:2px}.def dd{margin:0}
@media(max-width:600px){.def dl{grid-template-columns:minmax(0,1fr)}.def dt{padding-top:6px}}
/* Meetings and projects */
.pbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin-bottom:16px;border:1px solid var(--line);border-radius:10px;background:var(--th)}
.psel{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.psel select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;min-height:42px;padding:4px 8px;max-width:min(320px,70vw)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.primary:hover{opacity:.9;background:var(--ink)}
.newp{margin-bottom:16px;border-color:var(--hv)}
.newp input[name=name]{min-width:min(320px,80vw)}
.lrow input[name=name],.lrow input[name=currency]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;min-height:44px;padding:4px 8px}
.upl{margin-bottom:16px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:120px;border:2px dashed var(--line);border-radius:10px;cursor:pointer;text-align:center;padding:16px;margin:8px 0}
.drop b{font-size:16px}.drop span{color:var(--muted);font-size:14px}.drop:hover,.drop.over{border-color:var(--hv);background:var(--th)}
.drop:focus-within{outline:3px solid var(--hv);outline-offset:2px}
.paste summary{cursor:pointer;font-weight:600;min-height:32px}.paste textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin:6px 0}
.momst{font-weight:600;color:var(--ink)}
.review{border-color:var(--hv);border-width:1.5px;margin-bottom:16px}
table.rv{min-width:1100px}table.rv textarea{width:100%;min-width:260px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
table.rv tr.off td{opacity:.45}table.rv input[type=checkbox]{width:22px;height:22px;accent-color:var(--hv)}
details.xt summary{cursor:pointer;margin-top:12px;font-weight:600}details.xt pre{max-height:320px;overflow:auto;white-space:pre-wrap;font-size:12.5px}
td.acts{white-space:nowrap}td.acts .btn{margin:2px}
.tag.act{background:#e3d7ff}
.lg.tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--c-ev);background:none;border-radius:0}
table.rv select{min-width:132px}table.rv td:nth-child(3) select{min-width:76px}
tr.crit td{background:color-mix(in srgb,var(--bad) 10%,transparent)}tr.crit td:first-child{box-shadow:inset 3px 0 var(--bad)}
.lg.br{background:var(--bad);opacity:.6;height:10px}.lg.fl{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)}
.lg.ce{background:var(--c-ev);height:10px}

<script>
// Meeting minutes (MOM) intake: read PDF / image files in the browser, extract decisions, actions,
// critical items and variations, and store the original files in IndexedDB for later review.
// Free, no API key: pdf.js (text PDFs) and Tesseract.js (OCR for scans and photos), loaded on demand.
window.Mom = (() => {
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  const MON = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

  const loaded = {};
  function loadScript(src) {
    if (!loaded[src]) loaded[src] = new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => bad(new Error('Could not load ' + src + '. Check the internet connection.')); document.head.appendChild(s); });
    return loaded[src];
  }

  // ---------- file storage (IndexedDB) ----------
  let dbp;
  function db() {
    if (!dbp) dbp = new Promise((ok, bad) => { const r = indexedDB.open('cmg-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error); });
    return dbp;
  }
  async function putFile(id, rec) { const d = await db(); return new Promise((ok, bad) => { const t = d.transaction('files', 'readwrite'); t.objectStore('files').put(rec, id); t.oncomplete = ok; t.onerror = () => bad(t.error); }); }
  async function getFile(id) { const d = await db(); return new Promise((ok, bad) => { const r = d.transaction('files').objectStore('files').get(id); r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error); }); }
  async function delFile(id) { const d = await db(); return new Promise(ok => { const t = d.transaction('files', 'readwrite'); t.objectStore('files').delete(id); t.oncomplete = ok; t.onerror = ok; }); }

  // ---------- text extraction ----------
  async function ocr(images, progress) {
    await loadScript(TESS);
    const w = await Tesseract.createWorker('eng', 1, { logger: m => { if (m.status === 'recognizing text') progress(`Reading text (OCR) ${Math.round(m.progress * 100)}%`); } });
    let out = '';
    for (let i = 0; i < images.length; i++) { progress(`Reading page ${i + 1} of ${images.length} (OCR)…`); const r = await w.recognize(images[i]); out += r.data.text + '\n'; }
    await w.terminate();
    return out;
  }
  async function pdfText(buf, progress) {
    await loadScript(PDFJS);
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let p = 1; p <= pdf.numPages; p++) {
      progress(`Reading PDF page ${p} of ${pdf.numPages}…`);
      const page = await pdf.getPage(p), tc = await page.getTextContent(), rows = new Map();
      for (const it of tc.items) { const y = Math.round(it.transform[5] / 3); if (!rows.has(y)) rows.set(y, []); rows.get(y).push([it.transform[4], it.str]); }
      text += [...rows.entries()].sort((a, b) => b[0] - a[0]).map(([, r]) => r.sort((a, b) => a[0] - b[0]).map(x => x[1]).join(' ').replace(/\s+/g, ' ').trim()).filter(Boolean).join('\n') + '\n';
    }
    if (text.replace(/\s/g, '').length > 40 * pdf.numPages) return text;
    // Scanned PDF: render pages and OCR them.
    const imgs = [];
    for (let p = 1; p <= Math.min(pdf.numPages, 15); p++) {
      progress(`Preparing scanned page ${p} for OCR…`);
      const page = await pdf.getPage(p), vp = page.getViewport({ scale: 2 }), c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height; await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; imgs.push(c);
    }
    return ocr(imgs, progress);
  }
  async function extractText(file, progress) {
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    if (isPdf) return pdfText(await file.arrayBuffer(), progress);
    if (/^image\//.test(file.type) || /\.(jpe?g|png|webp|bmp|gif|tiff?)$/i.test(file.name)) return ocr([file], progress);
    if (/^text\//.test(file.type) || /\.txt$/i.test(file.name)) return file.text();
    throw new Error('Upload a PDF, a JPG/PNG image or a text file.');
  }

  // ---------- parsing ----------
  const pad = n => String(n).padStart(2, '0');
  function parseDate(s) {
    s = String(s || ''); let m;
    if ((m = s.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    if ((m = s.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/))) { let y = +m[3]; if (y < 100) y += 2000; const d = +m[1], mo = +m[2]; if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return `${y}-${pad(mo)}-${pad(d)}`; }
    if ((m = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?[\s\-]+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?[\s,\-]+(\d{4})\b/i))) return `${m[3]}-${pad(MON.indexOf(m[2].toLowerCase().slice(0, 3)) + 1)}-${pad(m[1])}`;
    if ((m = s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/i))) return `${m[3]}-${pad(MON.indexOf(m[1].toLowerCase().slice(0, 3)) + 1)}-${pad(m[2])}`;
    return '';
  }
  const RX = {
    variation: /\b(variation|change order|change request|VO\b|PCO\b|additional (work|works|scope|cost|item|items|quantity)|extra (work|works|cost|over|item)|omit(ted)?|omission|delet(e|ed|ion) of|upgrade[ds]?|substitut\w*|revised? (design|scope|layout|drawing)|scope change|change in scope|client request\w*|owner request\w*|employer request\w*)/i,
    decision: /\b(agreed|decided|decision|approved|approval (was |is )?(given|granted)|confirmed|resolved|accepted|instructed)\b/i,
    critical: /\b(critical|urgent\w*|immediate(ly)?|asap|delay(ed|s)?|stop(page| work)?|safety|accident|incident|on hold|suspend\w*|penalt\w*|liquidated|LDs?\b|non-?compliance|failure)\b/i,
    action: /\b(action|to (submit|provide|issue|confirm|revert|send|prepare|arrange|review|update|coordinate|resolve|complete|share|finali[sz]e)|shall|responsible|due (date|by|on)|pending)\b/i,
    approvedByClient: /\b(approved|instructed|agreed|confirmed|accepted)\b[^.]*\b(client|owner|employer)\b|\b(client|owner|employer)\b[^.]*\b(approved|instructed|agreed|confirmed|accepted)\b/i,
    party: /\b(client|owner|employer|main contractor|contractor|consultant|engineer|pmc|project manager|architect|designer|mep (contractor|consultant)|subcontractor|supplier|authority)\b/i,
  };
  const SKIP = /^(attendees|present|absent|distribution|agenda|apologies|circulation|copy to|cc)\b/i;
  const cap = s => s.replace(/\b\w/g, c => c.toUpperCase());

  function money(t) {
    const m = t.match(/(AED|USD|SAR|QAR|OMR|KWD|BHD|INR|EUR|GBP|Dhs?\.?|\$|€|£)\s?([\d,]+(?:\.\d+)?)\s*(k|m|mn|million|thousand)?\b/i) || t.match(/\b([\d,]+(?:\.\d+)?)\s*(AED|USD|SAR|QAR|OMR|INR|EUR|GBP|Dhs)\b/i);
    if (!m) return 0;
    const numStr = /^\d/.test(m[1]) ? m[1] : m[2], unit = /^\d/.test(m[1]) ? '' : (m[3] || '');
    let v = parseFloat(numStr.replace(/,/g, '')); if (/^(k|thousand)$/i.test(unit)) v *= 1e3; if (/^(m|mn|million)$/i.test(unit)) v *= 1e6;
    return isFinite(v) ? v : 0;
  }
  function wbsMatch(t, wbs) {
    const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    let T = norm(t); const stop = new Set(['and', 'the', 'works', 'work', 'site', 'setup', 'set', 'services', 'fit', 'out']);
    const SYN = [[/mechanical|electrical|plumbing|hvac|fire ?fighting|drainage|chiller|ductwork/, ' mep'], [/cladding|curtain ?wall|glazing|facade|louvre|envelope/, ' facade envelope'],
      [/finish|fit-?out|joinery|flooring|painting|ceiling|partition/, ' finishes'], [/landscap|external|paving|road|boundary/, ' external'],
      [/piling|piles|foundation|excavation|basement|substructure|pile cap/, ' substructure'], [/frame|slab|column|structural|superstructure|concrete works/, ' superstructure'],
      [/preliminar|general requirements|site establishment/, ' preliminaries']];
    for (const [rx, add] of SYN) if (rx.test(T)) T += add;
    for (const w of wbs) {
      if (w.code && new RegExp(`(^|[^\\d.])${String(w.code).replace('.', '\\.')}([^\\d]|$)`).test(t) && /wbs|item|package|element/i.test(t)) return w.code;
      const keys = norm(w.name).split(/[^a-z]+/).filter(k => k.length >= 3 && !stop.has(k));
      if (keys.some(k => new RegExp(`\\b${k}`).test(T))) return w.code;
    }
    return '';
  }
  function classify(t, wbs) {
    const isVar = RX.variation.test(t), isDec = RX.decision.test(t), isCrit = RX.critical.test(t), isAct = RX.action.test(t);
    const type = isVar ? 'Variation' : isDec ? 'Decision' : isCrit && !/\bto (submit|provide|issue|send|prepare)\b/i.test(t) ? 'Critical issue' : isAct ? 'Action' : isCrit ? 'Critical issue' : 'Note';
    let owner = '', m;
    if ((m = t.match(/(?:action(?:\s+by)?|resp(?:onsible|\.)?|owner|by)\s*[:\-–]\s*([A-Za-z][\w&\/.\- ]{1,40}?)(?=$|[,;.)]|\s{2}|\s+(?:by|before|due|on)\b)/i))) owner = m[1].trim();
    else if ((m = t.match(RX.party))) owner = cap(m[1]);
    const dueM = t.match(/\b(?:by|before|due(?:\s+date)?|on or before|target(?:\s+date)?|deadline)\s*[:\-]?\s*(.{4,30})/i);
    const due = dueM ? parseDate(dueM[1]) : '';
    const daysM = (isVar || /extension|EOT|time impact/i.test(t)) ? t.match(/\b(\d{1,3})\s*(?:calendar\s+|working\s+)?days?\b/i) : null;
    return { include: type !== 'Note', type, critical: isCrit ? 'Yes' : 'No', text: t.length > 400 ? t.slice(0, 397) + '…' : t, owner, due, value: isVar ? money(t) : 0,
      days: daysM ? +daysM[1] : 0, wbs: wbsMatch(t, wbs), pcoStatus: isVar && RX.approvedByClient.test(t) ? 'Approved' : 'Potential' };
  }
  function parse(text, fileName, wbs) {
    const lines = String(text).replace(/\r/g, '').split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
    let date = '';
    for (const l of lines.slice(0, 40)) if (/\b(date|held on|dated)\b/i.test(l) && (date = parseDate(l))) break;
    if (!date) for (const l of lines) if ((date = parseDate(l))) break;
    const refM = text.match(/\bMOM\s*(?:no\.?|number|#|ref\.?)\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-\/_.]{0,20})/i) || text.match(/\b(?:minutes of meeting|meeting|mtg)\s*(?:no\.?|number|#|ref\.?)\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-\/_.]{0,20})/i);
    const head = lines.slice(0, 15);
    const title = (head.find(l => /meeting\s*(no\.?|number|#)/i.test(l)) || head.find(l => /meeting|minutes|MOM/i.test(l) && !/^minutes of meeting$/i.test(l)) || head.find(l => /meeting|minutes|MOM/i.test(l)) || fileName).slice(0, 120);
    // Items: numbered or bulleted lines, with continuation lines appended.
    const START = /^(\(?\d{1,2}[).:]|\d{1,2}(?:\.\d{1,2}){1,2}[).:]?|\(?[a-z][).]|[-•*▪●○■])\s+(?=\S)/i;
    const items = []; let curItem = null, skipping = false;
    for (const l of lines) {
      if (SKIP.test(l)) { skipping = true; curItem = null; continue; }
      if (START.test(l)) { skipping = false; curItem = l.replace(START, ''); items.push(curItem); continue; }
      if (curItem !== null && !skipping && !/^(page \d|minutes of meeting)/i.test(l)) { items[items.length - 1] += ' ' + l; curItem = items[items.length - 1]; }
    }
    let raw = items.filter(s => s.length > 12);
    if (raw.length < 2) raw = lines.join(' ').split(/(?<=[.;])\s+(?=[A-Z0-9])/).map(s => s.trim()).filter(s => s.length > 25 && !SKIP.test(s));
    return { date, ref: refM ? refM[1] : '', title, items: raw.slice(0, 200).map(t => classify(t, wbs)) };
  }

  // ---------- compact storage: small originals kept; large ones stored as compressed page images ----------
  const KEEP_MAX = 300 * 1024, MAX_DIM = 1600, MAX_PAGES = 40;
  function canvasBlob(c, q) {
    return new Promise(ok => c.toBlob(b => {
      if (b && b.type === 'image/webp') return ok(b);
      c.toBlob(j => ok(j), 'image/jpeg', q); // browsers without WebP encoding
    }, 'image/webp', q));
  }
  function fitCanvas(w, h, draw) {
    const s = Math.min(1, MAX_DIM / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); draw(g, c.width, c.height);
    return c;
  }
  async function gzip(text) {
    if (typeof CompressionStream === 'undefined') return { textBlob: new Blob([text], { type: 'text/plain' }), gz: false };
    const s = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
    return { textBlob: await new Response(s).blob(), gz: true };
  }
  async function gunzip(rec) {
    if (!rec.textBlob) return rec.text || '';
    if (!rec.gz) return rec.textBlob.text();
    return new Response(rec.textBlob.stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  async function compact(file, text, progress) {
    const t = await gzip(text || '');
    const rec = { name: file ? file.name : 'Pasted text', type: file ? file.type : 'text/plain', origSize: file ? file.size : (text || '').length, pages: [], original: null, ...t };
    if (!file) { rec.storedSize = t.textBlob.size; return rec; }
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    if (file.size <= KEEP_MAX) rec.original = file;
    else if (isPdf) {
      await loadScript(PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      for (let p = 1; p <= Math.min(pdf.numPages, MAX_PAGES); p++) {
        progress(`Compressing page ${p} of ${pdf.numPages} for storage…`);
        const page = await pdf.getPage(p), v1 = page.getViewport({ scale: 1 }), scale = Math.min(2, MAX_DIM / Math.max(v1.width, v1.height));
        const vp = page.getViewport({ scale }), c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        await page.render({ canvasContext: g, viewport: vp }).promise;
        rec.pages.push(await canvasBlob(c, 0.55));
      }
    } else if (/^image\//.test(file.type) || /\.(jpe?g|png|webp|bmp|gif)$/i.test(file.name)) {
      progress('Compressing image for storage…');
      const bmp = await createImageBitmap(file);
      rec.pages.push(await canvasBlob(fitCanvas(bmp.width, bmp.height, (g, w, h) => g.drawImage(bmp, 0, 0, w, h)), 0.6));
    } else rec.original = file;
    rec.storedSize = (rec.original ? rec.original.size : 0) + rec.pages.reduce((s, b) => s + b.size, 0) + t.textBlob.size;
    return rec;
  }
  // Opens the stored document in a new tab: the original if kept, otherwise its compressed pages.
  async function openStored(id) {
    const rec = await getFile(id);
    if (!rec) throw new Error('The stored file is not in this browser.');
    let url;
    if (rec.original || rec.blob) url = URL.createObjectURL(rec.original || rec.blob);
    else if (rec.pages && rec.pages.length) {
      const imgs = rec.pages.map(b => URL.createObjectURL(b));
      const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const html = `<!DOCTYPE html><meta charset="utf-8"><title>${esc(rec.name)}</title><body style="margin:0;background:#555;font:14px sans-serif"><p style="color:#fff;padding:8px 16px;margin:0">${esc(rec.name)} · compressed copy, ${rec.pages.length} page(s)</p>${imgs.map(u => `<img src="${u}" style="display:block;max-width:100%;margin:0 auto 12px;background:#fff">`).join('')}</body>`;

  async function usage() { try { const e = await navigator.storage.estimate(); return e.usage || 0; } catch (err) { return 0; } }

  // ---------- WBS baseline and contractor progress reports ----------
  const DATE_RX = /\b\d{4}-\d{1,2}-\d{1,2}\b|\b\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}\b|\b\d{1,2}(?:st|nd|rd|th)?[\s\-]+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?[\s,\-]+\d{4}\b|\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:st|nd|rd|th)?,?\s+\d{4}\b/gi;
  const CODE_RX = /^\(?((?:\d{1,3}\.)+\d{0,3}|\d{1,3}(?=\s))\)?\s+/;
  const docLines = text => String(text).replace(/\r/g, '').split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  function reportDate(lines) {
    for (const l of lines.slice(0, 40)) if (/\b(date|as of|as at|period ending|cut-?off|status date|data date|week ending|month ending)\b/i.test(l)) { const d = parseDate(l); if (d) return d; }
    for (const l of lines) { const d = parseDate(l); if (d) return d; }
    return '';
  }
  function parseWbs(text) {
    const rows = [];
    for (const l of docLines(text)) {
      const m = l.match(CODE_RX); if (!m) continue;
      let code = m[1].replace(/\.$/, '.0'); if (/^\d+$/.test(code)) code += '.0';
      let rest = l.slice(m[0].length);
      const dates = (rest.match(DATE_RX) || []).map(parseDate).filter(Boolean);
      const noDates = rest.replace(DATE_RX, ' ');
      const nums = (noDates.match(/(?:AED|USD|SAR|QAR|OMR|INR|EUR|GBP|\$|€|£)?\s?\d[\d,]*(?:\.\d+)?\s*(?:k|m|mn|million)?\b(?!\s*%)/gi) || [])
        .map(s => { let v = parseFloat(s.replace(/[^\d.]/g, '')); if (/(m|mn|million)\s*$/i.test(s)) v *= 1e6; else if (/k\s*$/i.test(s)) v *= 1e3; return v; }).filter(v => isFinite(v));
      const name = noDates.replace(/(?:AED|USD|SAR|QAR|OMR|INR|EUR|GBP|\$|€|£)?\s?\d[\d,]*(?:\.\d+)?\s*(?:k|m|mn|million|%|days?)?\b/gi, ' ').replace(/[|:;,]+/g, ' ').replace(/\s+/g, ' ').trim();

      if (lx + 36 < x1) s += `<text x="${lx}" y="${y + 24}" font-size="11" font-weight="700" fill="${a.critical ? 'var(--bad)' : 'var(--muted)'}">${lab}</text>`;
    });
    const dx = X(Math.floor(dd() / DAY));
    s += `<line x1="${dx}" x2="${dx}" y1="${top - 6}" y2="${H - 4}" stroke="var(--hv)" stroke-width="2"/><text x="${dx}" y="${top - 9}" font-size="10.5" text-anchor="middle" fill="var(--hvink)" font-weight="700">Data date</text>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="height:${H}px">${s}</svg>`;
  }

  // ---------- manpower and plant ----------
  function vResources() {
    const mp = D.manpower, pl = D.plant;
    const dates = [...new Set(mp.map(r => r.date))].filter(d => isFinite(dt(d))).sort((a, b) => dt(a) - dt(b));
    const last = dates[dates.length - 1], onDate = d => mp.filter(r => r.date === d);
    const head = d => sum(onDate(d), r => r.count), plan = d => sum(onDate(d), r => r.planned);
    const peak = dates.length ? Math.max(...dates.map(head)) : 0, avg = dates.length ? Math.round(sum(dates, head) / dates.length) : 0;
    const wk = sum(pl, r => r.working), id = sum(pl, r => r.idle), bd = sum(pl, r => r.breakdown), util = wk + id + bd ? wk / (wk + id + bd) * 100 : 0;
    const eq = [...new Set(pl.map(r => r.equipment))].map(e => { const l = pl.filter(r => r.equipment === e); return { e, w: sum(l, r => r.working), i: sum(l, r => r.idle), b: sum(l, r => r.breakdown), q: Math.max(...l.map(r => num(r.qty))) }; });
    const maxH = Math.max(1, ...eq.map(x => x.w + x.i + x.b));
    const plantBars = eq.length ? '<div class="pipe">' + eq.map(x => `<div class="prow wide"><span>${esc(x.e)} <small>(×${x.q})</small></span><div class="track"><div class="stackbar"><i class="st-approved" style="width:${x.w / maxH * 100}%" title="Working ${x.w} h"></i><i class="st-submitted" style="width:${x.i / maxH * 100}%" title="Idle ${x.i} h"></i><i class="st-rejected" style="width:${x.b / maxH * 100}%" title="Breakdown ${x.b} h"></i></div></div><b>${x.w + x.i + x.b ? Math.round(x.w / (x.w + x.i + x.b) * 100) : 0}%</b></div>`).join('') + '</div>' + legend([['pa', 'Working'], ['pe', 'Idle'], ['br', 'Breakdown']]) : '<p class="cap">Add plant entries below.</p>';
    const latest = last ? onDate(last).map(r => `<tr><td>${esc(r.trade)}</td><td>${esc(r.company)}</td><td class="r">${num(r.count)}</td><td class="r">${num(r.planned) || '—'}</td><td class="r">${num(r.planned) ? (num(r.count) - num(r.planned) > 0 ? '+' : '') + (num(r.count) - num(r.planned)) : '—'}</td></tr>`) : [];
    return `<div class="kpis">
      ${kpi('Manpower on site', last ? String(head(last)) : '—', last ? `${fmtD(last)} · planned ${plan(last) || '—'}` : 'add manpower entries', last && plan(last) ? (head(last) >= plan(last) ? 'good' : 'bad') : '')}
      ${kpi('Peak manpower', String(peak), `average ${avg} over ${dates.length} records`)}
      ${kpi('Plant utilisation', pct(util), `${wk} working of ${wk + id + bd} hours`, util >= 75 ? 'good' : util >= 60 ? 'warn' : 'bad')}
      ${kpi('Idle hours', String(id), 'plant on site but not working', id ? 'warn' : 'good')}
      ${kpi('Breakdown hours', String(bd), `${pl.filter(r => num(r.breakdown) > 0).length} breakdown records`, bd ? 'bad' : 'good')}
    </div><div class="dgrid">
      ${card('Manpower histogram', 'Headcount on site by trade; the dashed line is the planned headcount.', `<div class="legend">${[...new Set(mp.map(r => r.trade))].map((t, i) => `<span><i class="lg" style="background:${TRADE_COL[i % TRADE_COL.length]};height:10px"></i>${esc(t)}</span>`).join('')}<span><i class="lg pv"></i>Planned</span></div>` + fig('manpower'), 1)}
      ${card('Plant utilisation by equipment', 'Working, idle and breakdown hours in the log; % = working ÷ total hours.', plantBars)}
      ${card(`Manpower by trade${last ? ' on ' + fmtD(last) : ''}`, '', tbl(['Trade', 'Company', 'Actual', 'Planned', 'Variance'], latest, [2, 3, 4]))}
    </div>`;
  }
  const TRADE_COL = ['#0b4fc4', '#ff6b1a', '#0f8a5f', '#8a5cf6', '#c0362c', '#b26a00', '#2aa1b3', '#6b7a99'];
  function drawManpower(el) {
    const W = el.clientWidth, H = el.clientHeight; if (!W) return;
    const mp = D.manpower, dates = [...new Set(mp.map(r => r.date))].filter(d => isFinite(dt(d))).sort((a, b) => dt(a) - dt(b));
    if (!dates.length) return empty(el, 'Add manpower entries below.');
    const trades = [...new Set(mp.map(r => r.trade))], small = W < 520, m = { l: 44, r: 12, t: 12, b: 26 };
    const tot = d => sum(mp.filter(r => r.date === d), r => r.count), pl = d => sum(mp.filter(r => r.date === d), r => r.planned);
    const max = niceMax(Math.max(...dates.map(d => Math.max(tot(d), pl(d)))));
    const gw = (W - m.l - m.r) / dates.length, bw = Math.min(46, gw * 0.7), y = v => H - m.b - (H - m.t - m.b) * v / max;
    let s = yAxis(W, H, m, max, v => Math.round(v));
    dates.forEach((d, i) => {
      const cx = m.l + gw * i + gw / 2; let acc = 0;
      trades.forEach((t, k) => { const v = sum(mp.filter(r => r.date === d && r.trade === t), r => r.count); if (!v) return; s += `<rect x="${cx - bw / 2}" y="${y(acc + v)}" width="${bw}" height="${y(acc) - y(acc + v)}" fill="${TRADE_COL[k % TRADE_COL.length]}"><title>${esc(fmtD(d) + ' · ' + t + ': ' + v)}</title></rect>`; acc += v; });
      if (i % Math.ceil(dates.length / (small ? 5 : 12)) === 0 || i === dates.length - 1) s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(fmtD(d).replace(/ \d\d$/, ''))}</text>`;
    });
    const pts = dates.map((d, i) => [m.l + gw * i + gw / 2, pl(d)]).filter(p => p[1] > 0);
    if (pts.length) s += `<polyline fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4" points="${pts.map(p => p[0] + ',' + y(p[1])).join(' ')}"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
  }

  const typeTag = l => `<span class="tag ${l.critical === 'Yes' ? 'bad' : l.type === 'Variation' ? 'warn' : l.type === 'Decision' ? 'info' : l.type === 'Action' ? 'act' : ''}">${esc(l.type)}${l.critical === 'Yes' && l.type !== 'Critical issue' ? ' · critical' : ''}</span>`;

  function reviewPanel() {

    const rows = p.items.map((it, i) => `<tr class="${it.include ? '' : 'off'}"><td><input type="checkbox" data-pi="${i}" data-pk="include"${it.include ? ' checked' : ''} aria-label="Add this item"></td>

      <td><input class="r" inputmode="decimal" data-pi="${i}" data-pk="value" value="${esc(it.value || '')}"></td><td><input class="r" inputmode="decimal" data-pi="${i}" data-pk="days" value="${esc(it.days || '')}"></td>

      <td><select data-pi="${i}" data-pk="follow" class="fol"><option value="">New item</option>${ths.map(t => `<option value="${esc(t.id)}"${t.id === it.follow ? ' selected' : ''}>${esc(t.last.mom + ': ' + t.last.text.slice(0, 70))}</option>`).join('')}</select></td></tr>`).join('');
    return `<section class="card review"><h3>Review what was found: ${esc(p.fileName)}</h3>

      <p class="cap">${p.items.length} items found. Untick anything that should not be added and correct the type, owner, dates, WBS or amounts. "Variation" rows become PCOs; set PCO status to Approved when the client approved or instructed it, and it is recorded as a change order. "Follows up" links the minute to the same item in an earlier meeting (suggested automatically); the earlier entry is then closed and the trail continues.</p>
      ${p.items.length ? `<div class="tw"><table class="ed rv"><thead><tr><th>Add</th><th>Type</th><th>Critical</th><th>Item</th><th>Owner</th><th>Due</th><th>WBS</th><th>Value</th><th>Days</th><th>PCO status</th><th>Follows up (trail)</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p>No items were recognised. Check the extracted text below; you can paste corrected text instead.</p>'}
      <datalist id="dash-wbs2">${D.wbs.map(w => `<option value="${esc(w.code)}">${esc(w.name)}</option>`).join('')}</datalist>
      <div class="acts"><button type="button" class="btn sm primary" data-act="mom-save">Add to project</button><button type="button" class="btn sm" data-act="mom-discard">Discard</button></div>
      <details class="xt"><summary>Show the extracted text</summary><pre>${esc(p.text.slice(0, 20000))}</pre></details></section>`;
  }
  // ---------- item trail: link each new minute to the same item in earlier meetings ----------
  const STOPW = new Set(['the', 'and', 'for', 'with', 'that', 'this', 'from', 'will', 'shall', 'have', 'been', 'into', 'than', 'they', 'their', 'there', 'were', 'which', 'contractor', 'consultant', 'client', 'owner', 'employer', 'submit', 'agreed', 'meeting', 'item', 'items', 'days', 'week', 'weeks', 'action', 'plan', 'provide', 'confirm', 'issue', 'review', 'update', 'under', 'watch', 'remain']);
  const toks = t => new Set((String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').match(/[A-Za-z][A-Za-z0-9]*/g) || [])
    .filter(w => w.length >= 4 || (w.length >= 2 && w === w.toUpperCase()))
    .map(w => { w = w.toLowerCase(); return w.length > 4 && w.endsWith('s') ? w.slice(0, -1) : w; })
    .filter(w => !STOPW.has(w)));
  const jac = (a, b) => { let n = 0; for (const x of a) if (b.has(x)) n++; return n / ((a.size + b.size - n) || 1); };
  function threads() {
    const by = {}; for (const l of D.log) (by[l.thread] = by[l.thread] || []).push(l);
    return Object.entries(by).map(([id, list]) => { list.sort(byDateAsc); return { id, list, last: list[list.length - 1] }; });
  }
  const byDateAsc = (a, b) => dt(a.date) - dt(b.date);
  function suggestFollow(items) {
    const cands = threads().filter(t => t.last.status !== 'Closed' || t.list.length > 0);
    for (const it of items) {
      const a = toks(it.text); let best = null, bs = 0;
      for (const t of cands) {
        let sc = Math.max(...t.list.map(l => jac(a, toks(l.text))));
        if (it.wbs && t.last.wbs && String(it.wbs) === String(t.last.wbs)) sc += 0.12;
        if (t.last.status === 'Closed') sc -= 0.08;
        if (sc > bs) { bs = sc; best = t; }
      }
      it.follow = best && bs >= 0.3 ? best.id : '';
    }
  }
  const CLOSE_RX = /\b(closed|completed|complete|resolved|done|received|accepted|issued|delivered in full|approved|finali[sz]ed)\b/i;
  function trailCard() {
    const ts = threads().filter(t => t.list.length > 1).sort((a, b) => dt(b.last.date) - dt(a.last.date));
    if (!ts.length) return card('Item trail across meetings', 'Items followed up in later meetings appear here as a trail, oldest first.', '<p class="cap">No item has been followed up in a later meeting yet.</p>', 1);
    return card('Item trail across meetings', 'Each item as it was recorded in successive meetings, oldest first, with its current status.',
      '<div class="trails">' + ts.map(t => `<article class="trail"><header><span>${typeTag(t.last)}</span><b>${esc((w => w ? wbsLabel(w) : 'General')((t.list.find(l => l.wbs) || {}).wbs))}</b><span class="tag ${t.last.status === 'Closed' ? 'good' : 'warn'}">${esc(t.last.status)}</span><small class="cap">${t.list.length} meetings</small></header>
        <ol>${t.list.map(l => `<li><div class="tl-when"><b>${esc(l.mom)}</b><small>${fmtD(l.date)}</small></div><div class="tl-what">${esc(l.text)}${l.owner ? ` <small class="cap">· ${esc(l.owner)}${l.due ? ', due ' + fmtD(l.due) : ''}</small>` : ''}</div></li>`).join('')}</ol></article>`).join('') + '</div>', 1);
  }

  function setMomMsg() { const m = root && root.querySelector('[data-msg="mom"]'); if (m) m.textContent = momBusy + (queue.length ? ` · ${queue.length} more file(s) waiting` : ''); }
  // Minutes are added automatically unless "Review before adding" is ticked.
  const autoMode = () => !D.project.momReview;
  let staged = [], failed = [];
  async function processNext() {
    if (pending || busy) return;
    if (!queue.length) { if (staged.length) await commitStaged(); return; }
    const file = queue.shift(); busy = true; momBusy = `Reading ${file.name}…`; setMomMsg();
    try {
      const text = await Mom.extractText(file, s => { momBusy = `${file.name}: ${s}`; setMomMsg(); });
      const p = Object.assign(Mom.parse(text, file.name, D.wbs), { fileName: file.name, file, text });
      if (autoMode()) { staged.push(p); momBusy = `Read ${file.name}: ${p.items.length} items.`; }
      else { suggestFollow(p.items); pending = p; momBusy = `${p.items.length} items found in ${file.name}. Review them below, then add them to the project.`; }
    } catch (err) { failed.push(file.name); momBusy = `${file.name}: ${err && err.message ? err.message : 'could not be read'}`; }
    busy = false;
    if (autoMode()) { setMomMsg(); processNext(); }
    else { tab = 'meetings'; render(); if (!pending) processNext(); }
  }
  // Add every file read in this batch, oldest meeting first, so follow-ups link in the right order.
  async function commitStaged() {
    const list = staged.sort((a, b) => (dt(a.date) || 0) - (dt(b.date) || 0)); staged = [];
    const done = [], skipped = [];
    let items = 0, linked = 0, pcos = 0;
    for (const p of list) {
      const ref = (p.ref || p.fileName.replace(/\.[^.]+$/, '')).slice(0, 40), date = p.date || D.project.dataDate;
      if (D.meetings.some(m => m.ref === ref && m.date === date)) { skipped.push(ref); continue; }
      suggestFollow(p.items); pending = p;
      const r = await commitPending(true);
      if (r) { done.push(ref); items += r.items; linked += r.linked; pcos += r.pcos; }
    }
    momBusy = (done.length ? `Added ${done.length} meeting${done.length > 1 ? 's' : ''} (${done.join(', ')}): ${items} items${linked ? `, ${linked} linked to earlier meetings` : ''}${pcos ? `, ${pcos} PCO(s) created or updated` : ''}.` : 'No new meetings added.')
      + (skipped.length ? ` Already recorded, skipped: ${skipped.join(', ')}.` : '') + (failed.length ? ` Could not read: ${failed.join(', ')}.` : '');
    failed = []; tab = 'meetings'; render();
  }
  const nextNo = (prefix, used) => { let n = 1; const u = new Set(used); while (u.has(prefix + String(n).padStart(3, '0'))) n++; return prefix + String(n).padStart(3, '0'); };
  async function commitPending(quiet) {
    const p = pending; if (!p || busy) return null;
    busy = true; momBusy = `Saving ${p.ref || p.fileName}…`; setMomMsg();
    const id = 'mom-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ref = (p.ref || p.fileName.replace(/\.[^.]+$/, '')).slice(0, 40), date = p.date || D.project.dataDate;
    const items = p.items.filter(x => x.include), counts = {}; let linked = 0, updated = 0;
    for (const it of items) {
      counts[it.type] = (counts[it.type] || 0) + 1;
      const thread = it.follow || newThread();
      if (it.follow && !it.wbs) { const w = D.log.filter(l => l.thread === it.follow && l.wbs).pop(); if (w) it.wbs = w.wbs; }
      if (it.follow) for (const l of D.log) if (l.thread === it.follow) l.status = 'Closed';

      const prior = it.type === 'Variation' && it.follow ? D.pcos.find(x => x.thread === it.follow) : null;

        if (num(it.days)) prior.days = num(it.days);
        if (it.pcoStatus === 'Approved' && prior.status !== 'Approved') { prior.status = 'Approved'; prior.co = prior.co || nextNo('CO-', D.pcos.map(x => x.co)); }

        updated++;

        D.pcos.push({ no: nextNo('PCO-', D.pcos.map(x => x.no)), desc: it.text.slice(0, 160), value: num(it.value), days: num(it.days), status: it.pcoStatus, co: appr ? nextNo('CO-', D.pcos.map(x => x.co)) : '', source: `${ref} (${fmtD(date)})`, thread });
      }
    }
    const meet = { id, ref, title: p.title, date, file: p.file ? p.fileName : '', origSize: p.file ? p.file.size : 0, stored: 0, uploaded: new Date().toISOString().slice(0, 10), counts };
    D.meetings.push(meet); save(); pending = null; if (!quiet) render();
    let stored = 0, note = '';
    try {
      const rec = await Mom.compact(p.file, p.text, s => { momBusy = s; setMomMsg(); });
      await Mom.putFile(id, rec); stored = rec.storedSize;
    } catch (e) { note = ' The file itself could not be stored in this browser.'; }
    meet.stored = stored; save(); busy = false;
    const v = items.filter(x => x.type === 'Variation');
    momBusy = `Added ${items.length} items from ${ref}${v.length - updated ? `, including ${v.length - updated} new PCO(s)` : ''}${linked ? `; ${linked} followed up earlier items` : ''}${updated ? `; ${updated} existing PCO(s) updated` : ''}.${stored && p.file ? ` Stored ${kb(stored)} (original ${kb(p.file.size)}).` : ''}${note}`;
    if (quiet) return { items: items.length, linked, pcos: v.length };
    render(); processNext();
  }

    }
    const rows = p.rows.map((r, i) => { const prev = actPct(r.code, dt(p.date) || dd());
      return `<tr class="${r.include ? '' : 'off'}"><td><input type="checkbox" data-di="${i}" data-dk="include"${r.include ? ' checked' : ''} aria-label="Use this row"></td>
        <td>${esc(r.code)} ${esc(r.name)}</td><td class="r">${prev}%</td><td><input class="r" inputmode="decimal" data-di="${i}" data-dk="pct" value="${esc(r.pct)}"></td><td><small class="cap">${esc(r.line)}</small></td></tr>`; }).join('');
    return `<section class="card review"><h3>Review progress report: ${esc(p.fileName)}</h3>
      <div class="pform"><label>Report date (progress as of)<input type="date" data-dm="date" value="${esc(p.date)}"></label></div>
      <p class="cap">${p.rows.length} WBS elements found with a % complete. Check each value against the report, then log them as current progress.</p>
      ${p.rows.length ? `<div class="tw"><table class="ed rv"><thead><tr><th>Use</th><th>WBS element</th><th>Last logged</th><th>Reported % complete</th><th>Line read from the report</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p>No WBS elements with a % were recognised. Check that the WBS baseline is entered and the report lists WBS codes or names with percentages.</p>'}
      <label class="inl"><input type="checkbox" data-dm="setDate"${p.setDate !== false ? ' checked' : ''}> Also set the dashboard data date to the report date</label>
      <div class="acts"><button type="button" class="btn sm primary" data-act="doc-apply">Log as current progress</button><button type="button" class="btn sm" data-act="doc-discard">Discard</button></div>
      <details class="xt"><summary>Show the extracted text</summary><pre>${esc(p.text.slice(0, 20000))}</pre></details></section>`;
  }
  function setDocMsg() { const m = root && root.querySelector('[data-msg="doc"]'); if (m) m.textContent = docBusy; }
  function readDoc(kind, text, fileName) {
    if (kind === 'tender') {
      const f = Mom.parseTender(text), rows = TENDER_FIELDS.filter(([k]) => f[k]).map(([k, label]) => ({ include: true, key: k, label, value: f[k] }));
      docPend = { kind, text, fileName, rows };
      docBusy = `${rows.length} contract particulars found in ${fileName}. Review them below.`;
    } else if (kind === 'boq') {
      const r = Mom.parseBoq(text, D.wbs);
      docPend = Object.assign(r, { kind, text, fileName, setBudgets: true, createNew: true, setContract: false });
      docBusy = `${r.rows.length} bills or sections found in ${fileName} (total ${money(r.grand, true)}). Review the WBS mapping below.`;
    } else {
      const r = kind === 'wbs' ? Mom.parseWbs(text) : Mom.parseProgress(text, D.wbs);
      docPend = Object.assign(r, { kind, text, fileName, mode: 'merge', setDate: true });
      docBusy = `${r.rows.length} ${kind === 'wbs' ? 'WBS rows' : 'progress values'} found in ${fileName}. Review them below.`;
    }
    tab = kind === 'tender' || kind === 'boq' ? 'contract' : 'schedule'; render();
  }
  const TENDER_FIELDS = [['name', 'Project name'], ['employer', 'Employer / client'], ['contractor', 'Contractor'], ['currency', 'Currency'], ['contract', 'Contract sum'],
    ['commencement', 'Commencement date'], ['completion', 'Completion date'], ['periodDays', 'Time for completion (days)'], ['retention', 'Retention %'], ['advance', 'Advance payment %'],
    ['ldRate', 'Liquidated damages rate'], ['ldPer', 'LDs per'], ['ldCap', 'LD cap % of contract'], ['dlpMonths', 'Defects liability period (months)']];
  const P_NUM = ['contract', 'retention', 'wCost', 'wTime', 'wCx', 'periodDays', 'advance', 'ldRate', 'ldCap', 'dlpMonths'];

  // ---------- contract particulars flow into every section ----------
  function syncContract() {
    const p = D.project;
    const up = (id, name, date, actual) => {
      if (!date) return;
      let m = D.milestones.find(x => x.id === id);
      if (!m) { m = { id, name, baseline: date, forecast: '', actual: '' }; D.milestones.push(m); } else { m.name = name; m.baseline = date; }
      if (actual !== undefined) m.actual = actual;
    };
    up('C-START', 'Contract commencement', p.commencement, p.commencement && dt(p.commencement) <= dd() ? p.commencement : '');
    up('C-END', 'Contract completion', p.completion);
    if (p.completion && num(p.dlpMonths)) { const d = new Date(dt(p.completion)); d.setUTCMonth(d.getUTCMonth() + num(p.dlpMonths)); up('C-DLP', 'End of defects liability period', d.toISOString().slice(0, 10)); }
    D.milestones.sort((a, b) => dt(a.baseline) - dt(b.baseline));
  }
  // The contract completion milestone always carries the CPM forecast.
  function syncForecast() {
    const m = D.milestones.find(x => x.id === 'C-END'); if (!m || m.actual) return;
    const c = cpm(); if (c.acts.length) m.forecast = c.finishDate;
  }
  function ldExposure() {
    const p = D.project; if (!p.completion || !num(p.ldRate)) return null;
    const c = cpm(); if (!c.acts.length) return null;
    const late = Math.max(0, Math.round((dt(c.finishDate) - dt(p.completion)) / DAY)), units = p.ldPer === 'week' ? Math.ceil(late / 7) : late;
    const raw = units * num(p.ldRate), cap = num(p.ldCap) ? num(p.contract) * num(p.ldCap) / 100 : Infinity;
    return { late, amount: Math.min(raw, cap), capped: raw > cap, cap, forecast: c.finishDate };
  }
  function ldKpi() {
    const e = ldExposure(); if (!e) return '';
    return kpi(`Delay penalty exposure (${esc(cur())})`, money(e.amount), e.late ? `${e.late} days late vs contract completion ${fmtD(D.project.completion)}${e.capped ? ' · at the LD cap' : ''}` : `on time for ${fmtD(D.project.completion)}`, e.late ? 'bad' : 'good');
  }

  // ---------- weightage of sub-works: cost, duration and complexity ----------
  function weights() {
    const a = num(D.project.wCost ?? 50), b = num(D.project.wTime ?? 30), g = num(D.project.wCx ?? 20), S = a + b + g || 1;
    const rows = D.wbs.map(w => {
      const T = isFinite(dt(w.start)) && isFinite(dt(w.finish)) ? Math.max(1, Math.round((dt(w.finish) - dt(w.start)) / DAY) + 1) : 0;
      const K = Math.min(5, Math.max(1, num(w.complexity) || 3));
      return { w, C: num(w.budget), T, K, KT: K * T };
    });
    const sc = sum(rows, r => r.C) || 1, st = sum(rows, r => r.T) || 1, sk = sum(rows, r => r.KT) || 1;
    rows.forEach(r => { r.c = r.C / sc; r.t = r.T / st; r.k = r.KT / sk; r.W = (a * r.c + b * r.t + g * r.k) / S; });
    return { rows, a, b, g };
  }
  function weightCard() {
    const { rows, a, b, g } = weights(), t = dd();
    const tr = rows.map(r => { const ap = actPct(r.w.code, t); return `<tr><td>${esc(r.w.code)}</td><td>${esc(r.w.name)}</td><td class="r">${money(r.C)} <small class="cap">${(r.c * 100).toFixed(1)}%</small></td><td class="r">${r.T} <small class="cap">${(r.t * 100).toFixed(1)}%</small></td><td class="r">${r.K}</td><td class="r">${(r.k * 100).toFixed(1)}%</td><td class="r"><b>${(r.W * 100).toFixed(1)}%</b></td><td class="r">${ap}%</td><td class="r">${(r.W * ap).toFixed(1)}%</td></tr>`; });
    const tot = sum(rows, r => r.W * actPct(r.w.code, t)), planned = sum(rows, r => r.W * planPct(r.w, t));
    tr.push(`<tr class="tot"><td></td><td>Total</td><td class="r">${money(sum(rows, r => r.C))}</td><td class="r">${sum(rows, r => r.T)}</td><td></td><td class="r">100%</td><td class="r">100%</td><td></td><td class="r">${tot.toFixed(1)}%</td></tr>`);
    return card('Weightage of sub-works', `Each WBS element's share of the whole programme combines its cost, its duration in days and the complexity of its scope. The weighted progress (${tot.toFixed(1)}% actual against ${planned.toFixed(1)}% planned) is the overall progress shown in the KPIs.`,
      `<div class="formula">W<sub>i</sub> = [ α · C<sub>i</sub>/ΣC + β · T<sub>i</sub>/ΣT + γ · (K<sub>i</sub>·T<sub>i</sub>)/Σ(K·T) ] ÷ (α + β + γ)</div>
      <p class="cap">C = cost (budget), T = duration in days from the baseline, K = complexity of scope from 1 (simple) to 5 (very complex), so K·T measures complexity-days. Overall progress = Σ W<sub>i</sub> × % complete<sub>i</sub>. Set the factors to match how your organisation weighs work:</p>
      <div class="pform wf"><label>α cost factor<input data-p="wCost" inputmode="decimal" value="${a}"></label><label>β duration factor<input data-p="wTime" inputmode="decimal" value="${b}"></label><label>γ complexity factor<input data-p="wCx" inputmode="decimal" value="${g}"></label></div>
      ${tbl(['Code', 'Element', 'Cost (share)', 'Days (share)', 'Complexity K', 'K·T share', 'Weight W', 'Actual %', 'W × actual'], tr, [2, 3, 4, 5, 6, 7, 8])}`, 1);
  }

  // ---------- contract particulars and BOQ ----------
  function vContract() {
    const p = D.project, c = esc(cur()), boqTotal = sum(D.boq, r => r.amount);
    const fld = (k, label, type) => `<label>${label}<input data-p="${k}"${type ? ` type="${type}"` : P_NUM.includes(k) ? ' inputmode="decimal"' : ''} value="${esc(p[k] ?? '')}"></label>`;
    const byW = {}; for (const r of D.boq) if (r.wbs) byW[r.wbs] = (byW[r.wbs] || 0) + num(r.amount);
    const rows = D.boq.map(r => `<tr><td>${esc(r.name)}</td><td class="r">${money(num(r.amount), true)}</td><td class="r">${boqTotal ? (num(r.amount) / boqTotal * 100).toFixed(1) : 0}%</td><td>${r.wbs ? esc(wbsLabel(r.wbs)) : '<span class="tag warn">not mapped</span>'}</td></tr>`);
    if (rows.length) rows.push(`<tr class="tot"><td>Total</td><td class="r">${money(boqTotal, true)}</td><td class="r">100%</td><td></td></tr>`);
    const gap = num(p.contract) - boqTotal;
    return `<div class="kpis">
      ${kpi(`Contract sum (${c})`, money(num(p.contract)), p.employer ? esc(p.employer) : 'set below or upload the contract')}
      ${kpi(`BOQ total (${c})`, boqTotal ? money(boqTotal) : '—', boqTotal ? (Math.abs(gap) < 1 ? 'matches the contract sum' : `${gap > 0 ? 'below' : 'above'} contract sum by ${money(Math.abs(gap))}`) : 'upload the BOQ', boqTotal ? (Math.abs(gap) < 1 ? 'good' : 'warn') : '')}
      ${kpi('Contract period', p.commencement && p.completion ? `${Math.round((dt(p.completion) - dt(p.commencement)) / DAY)} days` : '—', p.commencement ? `${fmtD(p.commencement)} → ${fmtD(p.completion)}` : 'commencement not set')}
      ${ldKpi()}
      ${kpi('Liquidated damages', num(p.ldRate) ? `${money(num(p.ldRate))}/${esc(p.ldPer || 'day')}` : '—', num(p.ldCap) ? `capped at ${num(p.ldCap)}% (${money(num(p.contract) * num(p.ldCap) / 100)})` : 'no cap recorded')}
    </div>
    <section class="card upl"><h3>Set up from tender and contract documents</h3>
      <p class="cap">Upload the tender or contract document (form of agreement, particular conditions, appendix to tender) to fill the contract particulars, and the priced BOQ to set WBS budgets. Files are read in your browser; you review everything before it is applied.</p>
      <div class="dgrid">
        <label class="drop" data-drop-kind="tender"><input type="file" accept=".pdf,image/*,.txt" data-act="tender-file" hidden><b>Upload tender / contract document</b><span>Contract sum, dates, retention, advance, LDs, defects period</span></label>
        <label class="drop" data-drop-kind="boq"><input type="file" accept=".pdf,image/*,.txt" data-act="boq-file" hidden><b>Upload priced BOQ</b><span>Bills and section totals, mapped to the WBS</span></label>
      </div>
      <details class="paste"><summary>Or paste the document text</summary><textarea data-doc-text rows="6" placeholder="Paste the contract particulars or the BOQ here"></textarea>
        <button type="button" class="btn sm" data-act="doc-paste-tender">Read as tender / contract</button> <button type="button" class="btn sm" data-act="doc-paste-boq">Read as BOQ</button></details>
      <p class="cap momst" data-msg="doc" role="status">${esc(docBusy)}</p></section>
    ${docPend && (docPend.kind === 'tender' || docPend.kind === 'boq') ? docReview() : ''}
    <div class="dgrid">
      ${card('Contract particulars', 'Edit directly or fill from the contract document above.', `<div class="pform">${fld('employer', 'Employer / client')}${fld('contractor', 'Contractor')}${fld('contract', 'Contract sum')}${fld('currency', 'Currency')}
        ${fld('commencement', 'Commencement date', 'date')}${fld('completion', 'Completion date', 'date')}${fld('retention', 'Retention %')}${fld('advance', 'Advance payment %')}
        ${fld('ldRate', 'LD rate')}<label>LDs per<select data-p="ldPer">${['day', 'week'].map(o => `<option${(p.ldPer || 'day') === o ? ' selected' : ''}>${o}</option>`).join('')}</select></label>${fld('ldCap', 'LD cap %')}${fld('dlpMonths', 'Defects period (months)')}</div>`, 1)}
      ${card('BOQ summary by bill', 'Each bill or section of the priced BOQ, its share of the total and the WBS element it funds.', tbl(['Bill / section', 'Amount', 'Share', 'WBS element'], rows, [1, 2]), 1)}
    </div>`;
  }
  async function processDoc(kind, file) {
    if (busy) return; busy = true; docBusy = `Reading ${file.name}…`; setDocMsg();
    try { const text = await Mom.extractText(file, s => { docBusy = `${file.name}: ${s}`; setDocMsg(); }); busy = false; readDoc(kind, text, file.name); }
    catch (err) { busy = false; docBusy = `${file.name}: ${err && err.message ? err.message : 'could not be read'}`; setDocMsg(); }
  }
  function applyDoc() {

      const sums = {}; let created = 0;

        if (!code && p.createNew) { code = next(); D.wbs.push({ code, name: r.name, budget: 0, start: '', finish: '', pred: '', complexity: 3 }); r.wbs = code; created++; }
        if (code) sums[code] = (sums[code] || 0) + num(r.amount);
      }

  }

  // ---------- pieces ----------
  function wbsBars() {

    return '<div class="wbs">' + D.wbs.map(w => {
      const a = actPct(w.code, t), p = planPct(w, t), tone = a + 0.5 >= p ? 'ok' : p - a > 10 ? 'late' : 'slip';
      return `<div class="wrow"><div class="wl"><b>${esc(w.code)}</b> ${esc(w.name)}<small>${a.toFixed(0)}% of ${p.toFixed(0)}% planned · ${money(num(w.budget))}</small></div>
        <div class="track" title="Actual ${a.toFixed(0)}%, planned ${p.toFixed(0)}%"><div class="fill ${tone}" style="width:${a}%"></div><div class="mark" style="left:${p}%"></div></div></div>`;
    }).join('') + '</div>';
  }
  function msTable() {
    return tbl(['ID', 'Milestone', 'Baseline', 'Forecast / actual', 'Var. (d)', 'Status'], [...D.milestones].sort((a, b) => dt(a.baseline) - dt(b.baseline)).map(m => {
      const s = msStatus(m), v = msVar(m);
      return `<tr><td>${esc(m.id)}</td><td>${esc(m.name)}</td><td>${fmtD(m.baseline)}</td><td>${fmtD(m.actual || m.forecast || m.baseline)}${m.actual ? ' (actual)' : ''}</td><td class="r">${v > 0 ? '+' : ''}${v}</td><td><span class="tag ${s[1]}">${s[0]}</span></td></tr>`;
    }), [4]);
  }
  function upcoming() {
    const list = D.milestones.filter(m => !m.actual).sort((a, b) => dt(a.forecast || a.baseline) - dt(b.forecast || b.baseline)).slice(0, 5);
    return tbl(['Milestone', 'Baseline', 'Forecast', 'Status'], list.map(m => { const s = msStatus(m); return `<tr><td>${esc(m.name)}</td><td>${fmtD(m.baseline)}</td><td>${fmtD(m.forecast || m.baseline)}</td><td><span class="tag ${s[1]}">${s[0]}</span></td></tr>`; }));
  }
  function heat() {
    const open = D.risks.filter(r => r.status !== 'Closed');
    let h = '<div class="heat"><div class="hy">Likelihood</div><div class="hg">';
    for (let l = 5; l >= 1; l--) {
      h += `<div class="hl">${l}</div>`;
      for (let i = 1; i <= 5; i++) { const n = open.filter(r => num(r.l) === l && num(r.i) === i).length, s = l * i; h += `<div class="hc ${s >= 15 ? 'hz3' : s >= 8 ? 'hz2' : 'hz1'}${n ? ' has' : ''}" title="L${l} × I${i} = ${s}: ${n} risk(s)">${n || ''}</div>`; }
    }
    return h + '<div></div>' + [1, 2, 3, 4, 5].map(i => `<div class="hl">${i}</div>`).join('') + '</div><div class="hx">Impact</div></div>';
  }
  function pipeline() {
    const vals = ['Potential', 'Submitted', 'Approved', 'Rejected'].map(s => { const l = D.pcos.filter(p => p.status === s); return { s, v: sum(l, p => p.value), n: l.length }; });
    const max = Math.max(1, ...vals.map(x => Math.abs(x.v)));
    return '<div class="pipe">' + vals.map(x => `<div class="prow"><span>${x.s} <small>(${x.n})</small></span><div class="track"><div class="fill st-${x.s.toLowerCase()}" style="width:${Math.abs(x.v) / max * 100}%"></div></div><b>${money(x.v)}</b></div>`).join('') + '</div>';
  }
  function paySummary(m) {
    const rows = [['IPCs certified (gross)', m.cert], ['IPCs paid', m.ipcPaid], ['IPC outstanding', m.ipcOut], ['Retention held', m.retHeld], ['Other payments paid', m.otherPaid], ['Other payments pending', m.otherPend], ['Total project spend', m.spend]];
    return tbl(['Item', 'Amount'], rows.map(([k, v], i) => `<tr${i === rows.length - 1 ? ' class="tot"' : ''}><td>${k}</td><td class="r">${money(v, true)}</td></tr>`), [1]);
  }
  function catBars() {

      '</div>' + legend([['pa', 'Paid'], ['pe', 'Pending']]);
  }
  function ifList(list) {
    if (!list.length) return '<p class="cap">None. All interface points are on time.</p>';
    return tbl(['ID', 'Interface point', 'Provider → receiver', 'Need-by', 'Late'], list.map(x => `<tr><td>${esc(x.id)}</td><td>${esc(x.desc)}<br><small class="cap">${esc(x.requirement)}</small></td><td>${esc(wbsLabel(x.from))} → ${esc(wbsLabel(x.to))}</td><td>${fmtD(x.needBy)}</td><td class="r">${Math.round((dd() - dt(x.needBy)) / DAY)} d</td></tr>`), [4]);
  }
  function matrix() {
    const parties = [...new Set(D.interfaces.flatMap(x => [String(x.from), String(x.to)]))].filter(Boolean)
      .sort((a, b) => { const wa = D.wbs.findIndex(w => String(w.code) === a), wb = D.wbs.findIndex(w => String(w.code) === b); return (wa < 0 ? 999 : wa) - (wb < 0 ? 999 : wb) || a.localeCompare(b); });
    if (!parties.length) return '<p class="cap">Add interface points below.</p>';
    const rank = x => ifOverdue(x) ? 3 : x.status === 'Open' ? 2 : x.status === 'Agreed' ? 1 : 0, cls = ['mx-done', 'mx-agreed', 'mx-open', 'mx-late'];
    const short = p => { const w = D.wbs.find(x => String(x.code) === p); return w ? `<b>${esc(w.code)}</b> ${esc(w.name.split(/[ (]/)[0])}` : esc(p); };
    let h = `<div class="tw"><table class="mx"><thead><tr><th>Provider ↓ / Receiver →</th>${parties.map(p => `<th>${short(p)}</th>`).join('')}</tr></thead><tbody>`;
    for (const a of parties) {
      h += `<tr><th>${short(a)}</th>`;
      for (const b of parties) {
        const l = D.interfaces.filter(x => String(x.from) === a && String(x.to) === b);
        h += a === b ? '<td class="mx-self"></td>' : l.length ? `<td class="${cls[Math.max(...l.map(rank))]}" title="${esc(l.map(x => x.id + ': ' + x.desc).join('\n'))}">${l.length}</td>` : '<td></td>';
      }
      h += '</tr>';
    }
    return h + '</tbody></table></div>';
  }

  // ---------- charts ----------
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p * 2) / 2 * p; }
  const mLabel = (t, small) => { const d = new Date(t); return small ? MON[d.getUTCMonth()][0] : `${MON[d.getUTCMonth()]} '${String(d.getUTCFullYear()).slice(2)}`; };
  function yAxis(W, H, m, max, fmt = money) {
    let g = '';
    for (let k = 0; k <= 4; k++) { const v = max * k / 4, y = H - m.b - (H - m.t - m.b) * k / 4; g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${m.l - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`; }
    return g;
  }
  function months() {
    const ts = D.wbs.flatMap(w => [dt(w.start), dt(w.finish)]).filter(isFinite);
    if (!ts.length) return [];
    const a = new Date(Math.min(...ts)), b = new Date(Math.max(...ts)), out = [];
    for (let y = a.getUTCFullYear(), mo = a.getUTCMonth(); Date.UTC(y, mo, 1) <= b.getTime(); mo++) { if (mo > 11) { mo = 0; y++; } out.push(monthEnd(y, mo)); if (out.length > 240) break; }
    return out;

  function lineSeries(pts, x, y, col, dash) {

  }
  function xLabels(ms, x, H, small) {
    const step = Math.ceil(ms.length / (small ? 5 : 12));
    return ms.map((t, i) => i % step === 0 || i === ms.length - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${mLabel(t, small)}</text>` : '').join('');
  }
  const empty = (el, s) => { el.innerHTML = `<p class="cap" style="padding:20px">${s}</p>`; };

  function drawScurve(el) {
    const W = el.clientWidth, H = el.clientHeight, ms = months(); if (!W) return; if (!ms.length) return empty(el, 'Add the WBS baseline to draw the S-curve.');
    const small = W < 520, m = { l: 58, r: 28, t: 12, b: 26 }, t0 = dd();
    const pv = ms.map((t, i) => [i, PV(t)]), ev = ms.map((t, i) => t <= t0 + 15 * DAY || i === 0 ? [i, EV(Math.min(t, t0))] : null);
    const ac = ms.map((t, i) => { const c = D.costs.find(c2 => { const d = new Date(dt(c2.month)); return monthEnd(d.getUTCFullYear(), d.getUTCMonth()) === t; }); return c ? [i, num(c.ac)] : null; });
    const max = niceMax(Math.max(...pv.map(p => p[1]), ...ac.filter(Boolean).map(p => p[1]), 1));
    const x = i => m.l + (ms.length === 1 ? (W - m.l - m.r) / 2 : (W - m.l - m.r) * i / (ms.length - 1)), y = v => H - m.b - (H - m.t - m.b) * v / max;
    const di = ms.findIndex(t => t >= t0); const dx = di < 0 ? null : x(di);
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${yAxis(W, H, m, max)}${dx !== null ? `<line x1="${dx}" x2="${dx}" y1="${m.t}" y2="${H - m.b}" stroke="var(--hv)" stroke-width="1.5" stroke-dasharray="3 3"/>` : ''}${lineSeries(pv, x, y, 'var(--c-pv)', 1)}${lineSeries(ac, x, y, 'var(--c-ac)')}${lineSeries(ev, x, y, 'var(--c-ev)')}${xLabels(ms, x, H, small)}</svg>`;
  }
  function drawIdx(el) {
    const W = el.clientWidth, H = el.clientHeight, t0 = dd(); if (!W) return;
    const ms = months().filter(t => t <= t0 + 15 * DAY).map(t => Math.min(t, t0)).filter(t => PV(t) > 0);
    const pts = ms.map(t => { const ev = EV(t), pv = PV(t), ac = ACat(t); return { t, cpi: ac ? ev / ac : NaN, spi: pv ? ev / pv : NaN }; });
    if (!pts.length) return empty(el, 'Log progress to draw the trend.');
    const small = W < 520, m = { l: 40, r: 28, t: 12, b: 26 };
    const vals = pts.flatMap(p => [p.cpi, p.spi]).filter(isFinite);
    const lo = Math.min(0.7, Math.floor(Math.min(...vals) * 20) / 20), hi = Math.max(1.2, Math.ceil(Math.max(...vals) * 20) / 20);
    const x = i => m.l + (pts.length === 1 ? (W - m.l - m.r) / 2 : (W - m.l - m.r) * i / (pts.length - 1)), y = v => H - m.b - (H - m.t - m.b) * (v - lo) / (hi - lo);
    let g = '';
    for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v.toFixed(2)}</text>`; }
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(1)}" y2="${y(1)}" stroke="var(--c-pv)" stroke-width="1.5" stroke-dasharray="6 4"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}${lineSeries(pts.map((p, i) => [i, p.cpi]), x, y, 'var(--c-ev)')}${lineSeries(pts.map((p, i) => [i, p.spi]), x, y, 'var(--c-ac)')}${xLabels(pts.map(p => p.t), x, H, small)}</svg>`;
  }
  function drawGantt(el) {
    const W = el.clientWidth; if (!W) return;
    if (!D.wbs.length) { el.style.height = '120px'; return empty(el, 'Add the WBS baseline to draw the programme.'); }
    const small = W < 560, lw = small ? 92 : 210, rowH = 30, top = 42, msLane = D.milestones.length ? 44 : 0, mtLane = D.meetings.length ? 40 : 0;
    const H = top + D.wbs.length * rowH + msLane + mtLane + 8;
    if (Math.abs(el.clientHeight - H) > 1) el.style.height = H + 'px';
    const ts = [...D.wbs.flatMap(w => [dt(w.start), dt(w.finish)]), ...D.milestones.flatMap(m => [dt(m.baseline), dt(m.forecast), dt(m.actual)]), ...D.meetings.map(m => dt(m.date)), dd()].filter(isFinite);
    const a = new Date(Math.min(...ts)), b = new Date(Math.max(...ts));
    const t0 = Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), 1), t1 = monthEnd(b.getUTCFullYear(), b.getUTCMonth());
    const x0 = lw + 6, x1 = W - 10, X = t => x0 + (x1 - x0) * (t - t0) / (t1 - t0);
    let s = '';
    // month grid
    const nMon = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + b.getUTCMonth() - a.getUTCMonth() + 1, step = Math.ceil(nMon / (small ? 4 : 14));
    for (let k = 0; k < nMon; k++) {
      const t = Date.UTC(a.getUTCFullYear(), a.getUTCMonth() + k, 1), xx = X(t);
      s += `<line x1="${xx}" x2="${xx}" y1="${top - 6}" y2="${H - 4}" stroke="var(--line)"/>`;
      if (k % step === 0) s += `<text x="${xx + 3}" y="${top - 26}" font-size="11" fill="var(--muted)">${mLabel(t, false)}</text>`;
    }
    const tnow = dd();
    D.wbs.forEach((w, i) => {
      const y = top + i * rowH, s0 = dt(w.start), f0 = dt(w.finish), act = actPct(w.code, tnow), pl = planPct(w, tnow);
      const nm = small ? w.code : `${w.code} ${w.name}`.slice(0, 30);
      s += `<text x="0" y="${y + rowH / 2 + 4}" font-size="12.5" fill="var(--ink)"><title>${esc(w.code + ' ' + w.name)}</title>${esc(nm)}</text>`;
      if (isFinite(s0) && isFinite(f0) && f0 > s0) {
        const bx = X(s0), bw = Math.max(2, X(f0) - X(s0)), by = y + 7, bh = rowH - 14;
        s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="3" fill="var(--c-bl)"><title>${esc(w.code)} baseline ${fmtD(w.start)} – ${fmtD(w.finish)}</title></rect>`;
        if (act > 0) s += `<rect x="${bx}" y="${by}" width="${bw * act / 100}" height="${bh}" rx="3" fill="${act + 0.5 >= pl ? 'var(--good)' : 'var(--bad)'}"><title>${esc(w.code)}: ${act}% complete, ${pl.toFixed(0)}% planned</title></rect>`;
        const lx = bx + bw + 4;
        for (const l of D.log) {
          if (String(l.wbs) !== String(w.code) || l.type === 'Note' || !isFinite(dt(l.date))) continue;
