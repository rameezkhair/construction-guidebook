      ${sc.note ? `<p class="cap">${sc.note}</p>` : ''}<div class="tw"><table class="ed"><thead><tr>${sc.cols.map(c => `<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>` +
      D[k].map((r, i) => `<tr>${sc.cols.map(c => `<td>${inp(c, r, i)}</td>`).join('')}<td><button type="button" class="x" data-del="${k}" data-i="${i}" aria-label="Delete row">×</button></td></tr>`).join('') +
      `</tbody></table></div><button type="button" class="btn sm" data-add="${k}">Add row</button></details>` +
      (k === 'interfaces' || k === 'progress' ? `<datalist id="dash-wbs">${codes.map(c => `<option value="${esc(c)}">`).join('')}</datalist>` : '');
  }

  // ---------- render ----------
  const VIEWS = { overview: vOverview, schedule: vSchedule, meetings: vMeetings, resources: vResources, contract: vContract, payments: vPayments, interfaces: vInterfaces, risks: vRisks, settings: vSettings };
  function drawCharts() {
    ros.forEach(r => r.disconnect()); ros = [];
    root.querySelectorAll('[data-chart]').forEach(el => { const f = CHARTS[el.dataset.chart]; let w = 0; const ro = new ResizeObserver(() => { if (el.clientWidth !== w) { w = el.clientWidth; f(el); } }); ro.observe(el); ros.push(ro); f(el); });
  }
  function refresh() { syncForecast(); const v = root.querySelector('.dview'); if (v) { v.innerHTML = VIEWS[tab](); drawCharts(); } root.querySelector('.dhead').innerHTML = head(); }
  const isSample = () => JSON.stringify(D) === JSON.stringify(sample());
  function projectBar() {
    const ix = index();
    return `<div class="pbar"><label class="psel">Project<select data-act="proj-switch" aria-label="Choose project">${ix.list.map(p => `<option value="${esc(p.id)}"${p.id === projId ? ' selected' : ''}>${esc(p.name || 'Untitled project')}</option>`).join('')}</select></label>
      <button type="button" class="btn sm primary" data-act="proj-save">Save</button><button type="button" class="btn sm" data-act="proj-new">New project</button>
      <button type="button" class="btn sm" data-act="proj-copy">Save as copy</button><button type="button" class="btn sm" data-act="proj-del">${delArm ? 'Confirm delete' : 'Delete'}</button>
      <span class="note" data-msg="proj" role="status">${esc(savedAt || 'Changes save automatically in this browser')}</span></div>
      ${showNew ? `<form class="card newp" data-form="newp"><h3>New project</h3><div class="lrow"><label>Project name<input name="name" required placeholder="e.g. Warehouse extension, Plot 12"></label>
        <label>Currency<input name="currency" value="${esc(D.project.currency || 'AED')}" size="6"></label>
        <label>Start from<span class="steps"><label class="chip"><input type="radio" name="start" value="blank" checked><span>Blank</span></label><label class="chip"><input type="radio" name="start" value="sample"><span>Sample data</span></label></span></label>
        <button class="btn sm primary" type="submit">Create project</button><button class="btn sm" type="button" data-act="proj-cancel">Cancel</button></div></form>` : ''}`;
  }
  const head = () => `${projectBar()}<h1>${esc(D.project.name || 'Project dashboard')}</h1><p class="lede">Data date ${fmtD(D.project.dataDate)} · Contract ${esc(cur())} ${money(num(D.project.contract), true)}${isSample() ? ' · <em>sample data: replace it with your project in each tab\'s edit sections</em>' : ''}</p>`;
  function render() {
    syncForecast();
    root.innerHTML = `<div class="dhead">${head()}</div>
      <div class="dtabs" role="tablist">${TABS.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}</div>
      <div class="dview">${VIEWS[tab]()}</div><div class="dedit">${TAB_TABLES[tab].map(editor).join('')}</div>`;
    drawCharts();
  }

  function setVal(t) {
    if (t.dataset.p) { D.project[t.dataset.p] = P_NUM.includes(t.dataset.p) ? num(t.value) : t.value; if (['commencement', 'completion', 'dlpMonths'].includes(t.dataset.p)) syncContract(); save(); return true; }
    if (t.dataset.t) { const col = SCHEMA[t.dataset.t].cols.find(c => c[0] === t.dataset.k); D[t.dataset.t][+t.dataset.i][t.dataset.k] = col[2] === 'n' ? num(t.value) : t.value; save(); return true; }
    return false;
  }
  function msg(where, s) { const m = root.querySelector(`[data-msg="${where}"]`); if (m) m.textContent = s; }
  function setPending(t) {
    if (!pending) return false;
    if (t.dataset.pm) { pending[t.dataset.pm] = t.value; return true; }
    if (t.dataset.pk) {
      const it = pending.items[+t.dataset.pi], k = t.dataset.pk;
      it[k] = k === 'include' ? t.checked : ['value', 'days'].includes(k) ? num(t.value) : t.value;
      if (k === 'include') t.closest('tr').classList.toggle('off', !t.checked);
      return true;
    }
    return false;
  }
  function setDoc(t) {
    if (!docPend) return false;
    if (t.dataset.if) { docPend.fields[t.dataset.if] = ['no', 'period', 'paidDate'].includes(t.dataset.if) ? t.value : num(t.value); return true; }
    if (t.dataset.sf) { const c = SCHEMA.subs.cols.find(x => x[0] === t.dataset.sf); docPend.fields[t.dataset.sf] = c && c[2] === 'n' ? num(t.value) : t.value; return true; }
    if (t.dataset.dm) { docPend[t.dataset.dm] = t.type === "checkbox" ? t.checked : t.value; return true; }
    if (t.dataset.dk) { const r = docPend.rows[+t.dataset.di], k = t.dataset.dk; r[k] = k === "include" ? t.checked : t.value; if (k === "include") t.closest("tr").classList.toggle("off", !t.checked); return true; }
    return false;
  }
  function onInput(e) { if (!setPending(e.target) && !setDoc(e.target)) setVal(e.target); }
  function onChange(e) {
    const t = e.target;
    if (setPending(t) || setDoc(t)) { if (t.dataset.if) render(); return; }
    if (t.hasAttribute('data-momreview')) { D.project.momReview = t.checked; save(); return; }
    const KIND = { 'wbs-file': 'wbs', 'prog-file': 'prog', 'tender-file': 'tender', 'boq-file': 'boq', 'sub-file': 'sub', 'ipc-file': 'ipc' };
    if (t.dataset.act === 'inv-file' && t.files.length) { const fl = [...t.files]; t.value = ''; processInvFiles(fl); return; }
    if (t.dataset.act === 'ipc-file' && t.files.length) { const fl = [...t.files]; t.value = ''; processIpcFiles(fl); return; }
    if (t.hasAttribute('data-ipcreview')) { D.project.ipcReview = t.checked; save(); return; }
    if (KIND[t.dataset.act] && t.files.length) { const f = t.files[0]; t.value = ''; processDoc(KIND[t.dataset.act], f); return; }
    if (t.dataset.act === 'proj-switch') { switchTo(t.value); return; }
    if (t.dataset.act === 'mom-file' && t.files.length) { queue.push(...t.files); t.value = ''; processNext(); setMomMsg(); return; }
    if (t.dataset.act === 'import' && t.files[0]) {
      t.files[0].text().then(txt => { const d = JSON.parse(txt); if (!d.project || !Array.isArray(d.wbs)) throw 0; for (const k of Object.keys(SCHEMA)) if (!Array.isArray(d[k])) d[k] = []; D = d; save(); render(); msg('settings', 'Data imported.'); })
        .catch(() => msg('settings', 'That file is not a dashboard export.'));
      return;
    }
    if (t.closest('[data-form]')) return;
    if (t.dataset.t === 'invoices' && ['paidAmount', 'status', 'total', 'category', 'ipc'].includes(t.dataset.k)) { setVal(t); const v = D.invoices[+t.dataset.i]; if (t.dataset.k === 'paidAmount') v.pays = num(v.paidAmount) ? [{ date: v.paidDate || D.project.dataDate, amount: num(v.paidAmount) }] : []; if (t.dataset.k !== 'status') syncInvPayments(v); save(); refresh(); return; }
    if (setVal(t)) { if (t.dataset.k === 'code' && t.dataset.t === 'wbs') render(); else refresh(); }
  }
  function onClick(e) {
    const b = e.target.closest('button'); if (!b || !root.contains(b) || b.closest('form')) return;
    if (b.dataset.tab) { tab = b.dataset.tab; render(); return; }
    if (b.dataset.add) { const k = b.dataset.add; e.preventDefault(); openEd.add(k); D[k].push(Object.fromEntries(SCHEMA[k].cols.map(c => [c[0], c[2] === 'n' ? 0 : c[2] === 's' ? c[3][0] : c[2] === 'd' ? D.project.dataDate : '']))); save(); render(); return; }
    if (b.dataset.del) { e.preventDefault(); D[b.dataset.del].splice(+b.dataset.i, 1); save(); render(); return; }
    const a = b.dataset.act;
    const pmsg = s => { const m = root.querySelector('[data-msg="proj"]'); if (m) m.textContent = s; };
    if (a === 'proj-save') { save(); pmsg(savedAt.startsWith('Saved') ? `${savedAt}. Project "${D.project.name}" is stored in this browser.` : savedAt); return; }
    if (a === 'proj-new') { showNew = true; render(); const i = root.querySelector('[data-form="newp"] input[name=name]'); if (i) i.focus(); return; }
    if (a === 'proj-cancel') { showNew = false; render(); return; }
    if (a === 'proj-copy') { D = JSON.parse(JSON.stringify(D)); D.project.name = (D.project.name || 'Project') + ' (copy)'; projId = newId(); save(); render(); pmsg(`Saved as a new project: ${D.project.name}`); return; }
    if (a === 'proj-del') {
      if (!delArm) { delArm = projId; render(); pmsg(`Click "Confirm delete" to remove "${D.project.name}" from this browser. Export it first if you may need it.`); setTimeout(() => { if (delArm) { delArm = ''; if (root.isConnected) render(); } }, 6000); return; }
      const ix = index(), gone = D.project.name;
      try { localStorage.removeItem(PKEY(projId)); } catch (e) {}
      for (const m of D.meetings) Mom.delFile(m.id);
      ix.list = ix.list.filter(p => p.id !== projId); ix.current = ix.list[0] ? ix.list[0].id : ''; writeIndex(ix); delArm = '';
      D = load(); render(); pmsg(`Deleted "${gone}".`); return;
    }
    if (a === 'mom-paste') {
      const ta = root.querySelector('[data-mom-text]'), txt = ta ? ta.value.trim() : '';
      if (!txt) { momBusy = 'Paste the minutes text first.'; setMomMsg(); return; }
      const p = Object.assign(Mom.parse(txt, 'Pasted text', D.wbs), { fileName: 'Pasted text', file: null, text: txt });
      if (autoMode()) { staged.push(p); ta.value = ''; commitStaged(); return; }
      suggestFollow(p.items); pending = p;
      momBusy = `${p.items.length} items found in the pasted text. Review them below.`; render(); return;
    }
    if (a === 'mom-save') { commitPending(); return; }
    if (a === 'doc-paste-ipc' && !D.project.ipcReview) { const ta = root.querySelector('[data-doc-text]'), txt = ta ? ta.value.trim() : ''; if (!txt) { docBusy = 'Paste the certificate text first.'; setDocMsg(); return; } ta.value = ''; commitIpcs([{ text: txt, file: null, fileName: 'Pasted text' }]); return; }
    if (a === 'ipc-new') { const last = sortedIpcs().pop(); const per = last && /^\d{4}-\d{2}$/.test(last.period) ? (() => { const [y, mo] = last.period.split('-').map(Number); return mo === 12 ? `${y + 1}-01` : `${y}-${String(mo + 1).padStart(2, '0')}`; })() : D.project.dataDate.slice(0, 7);
      docPend = { kind: 'ipc', text: '', fileName: 'manual entry', file: null, fields: { no: nextIpcNo(), period: per, cumGross: 0, previous: last && num(last.cumGross) ? num(last.cumGross) : 0, gross: 0, retention: 0, advance: 0, other: 0, net: 0, vat: 0, total: 0, applied: 0, paid: 0, paidDate: '' } };
      docBusy = 'Enter the certificate figures; the checks update as you type each value.'; render(); return; }
    if (a === 'pay-full' || a === 'pay-part') {
      const key = b.dataset.key, amtEl = root.querySelector(`[data-payamt="${CSS.escape(key)}"]`), dEl = root.querySelector(`[data-paydate="${CSS.escape(key)}"]`);
      const date = (dEl && dEl.value) || D.project.dataDate, amount = a === 'pay-full' ? 'full' : num(amtEl && amtEl.value);
      const m = recordPay(key, amount, date); if (m && !/^Enter/.test(m)) save(); docBusy = m; render(); return;
    }
    if (a === 'pay-undo') { undoPay(b.dataset.key, +b.dataset.i); save(); docBusy = 'Payment removed.'; render(); return; }
    if (a === 'inv-paste') { const ta = root.querySelector('[data-inv-text]'), txt = ta ? ta.value.trim() : ''; if (!txt) { docBusy = 'Paste the invoice text first.'; setDocMsg(); return; } ta.value = ''; commitInvoices([{ text: txt, file: null, fileName: 'Pasted text' }]); return; }
    if (a === 'inv-new') { D.invoices.push({ id: 'inv-' + Date.now().toString(36), date: D.project.dataDate, no: '', contractor: '', category: 'Main contractor IPC', ipc: '', amount: 0, vatRate: 5, vat: 0, total: 0, due: '', trn: '', status: 'Received' }); openEd.add('invoices'); save(); render(); const el = root.querySelector('[data-ed=invoices]'); if (el) el.scrollIntoView(); docBusy = 'New invoice row added at the end of the table below: fill it in.'; setDocMsg(); return; }
    if (a === 'inv-del') { const id = b.dataset.id; if (invDelArm !== id) { invDelArm = id; render(); setTimeout(() => { if (invDelArm === id) { invDelArm = ''; if (root.isConnected) render(); } }, 6000); return; } const v = D.invoices.find(x => (x.id || x.no) === id); if (v) { if (v.fileId) Mom.delFile(v.fileId); D.payments = D.payments.filter(p => !(v.id && p.invId === v.id)); } D.invoices = D.invoices.filter(x => (x.id || x.no) !== id); invDelArm = ''; save(); docBusy = `Deleted invoice ${v ? v.no : ''}${v && v.category !== 'Main contractor IPC' ? ' and its entry in Other project payments' : ''}.`; render(); return; }
    if (a === 'ipc-edit') { const r = D.ipcs.find(x => x.no === b.dataset.id); if (!r) return; docPend = { kind: 'ipc', text: '', fileName: 'corrections', file: null, fields: { no: r.no, period: r.period, cumGross: num(r.cumGross), previous: num(r.previous), gross: num(r.certified), retention: num(r.retention), advance: num(r.advance), other: num(r.other), net: num(r.statedNet), vat: num(r.vat), total: num(r.total), applied: num(r.applied), paid: num(r.paid), paidDate: r.paidDate || '', retentionRate: r.retentionRate } }; docBusy = `Correct the figures of ${r.no} as they appear on the certificate; the checks update as you type.`; render(); const rv = root.querySelector('.review'); if (rv) rv.scrollIntoView(); return; }
    if (a === 'ipc-reread') {
      (async () => {
        let ok = 0, none = 0, done = 0; const list = D.ipcs.filter(r => r.fileId);
        for (const r of list) {
          docBusy = `Re-reading ${r.no} (${++done} of ${list.length})…`; setDocMsg();
          try { const rec = await Mom.getFile(r.fileId); if (!rec) { none++; continue; } const text = await Mom.gunzip(rec); const F = ipcFields(text);
            if (num(F.gross) || num(F.net)) { Object.assign(r, { period: F.period || r.period, certified: num(F.gross), retention: num(F.retention), advance: num(F.advance), other: num(F.other), vat: num(F.vat), statedNet: num(F.net), cumGross: num(F.cumGross), total: num(F.total), previous: num(F.previous), retentionRate: F.retentionRate || null }); if (!num(r.applied)) r.applied = num(F.gross); ok++; } else none++; }
          catch (e) { none++; }
        }
        save(); docBusy = `Re-read ${list.length} IPC file${list.length === 1 ? '' : 's'}: ${ok} now have their figures${none ? `; ${none} still could not be read (open them and use “Correct figures”, or paste the certificate text so the reader can be improved)` : ''}.`; render();
      })();
      return;
    }
    if (a === 'ipc-del') { const no = b.dataset.id; if (ipcDelArm !== no) { ipcDelArm = no; render(); setTimeout(() => { if (ipcDelArm === no) { ipcDelArm = ''; if (root.isConnected) render(); } }, 6000); return; } const r = D.ipcs.find(x => x.no === no); if (r && r.fileId) Mom.delFile(r.fileId); D.ipcs = D.ipcs.filter(x => x.no !== no); ipcDelArm = ''; save(); docBusy = `Deleted ${no}.`; render(); return; }
    if (a && a.startsWith('doc-paste-')) { const ta = root.querySelector('[data-doc-text]'), txt = ta ? ta.value.trim() : ''; if (!txt) { docBusy = 'Paste the document text first.'; setDocMsg(); return; } readDoc(a.slice(10), txt, 'Pasted text'); return; }
    if (a === 'doc-apply') { applyDoc(); return; }
    if (a === 'sub-open') { Mom.openStored(b.dataset.id).catch(err => { docBusy = err.message; setDocMsg(); }); return; }
    if (a === 'doc-discard') { const wasIpc = docPend && docPend.kind === 'ipc'; docPend = null; docBusy = 'Discarded.'; if (wasIpc && ipcReadQueue.length) { const nx = ipcReadQueue.shift(); readDoc('ipc', nx.text, nx.fileName, nx.file); return; } render(); return; }
    if (a === 'mom-discard') { pending = null; momBusy = 'Discarded.'; render(); processNext(); return; }
    if (a === 'mom-open') { Mom.openStored(b.dataset.id).catch(err => { momBusy = err.message; setMomMsg(); }); return; }
    if (a === 'mom-del') {
      const id = b.dataset.id;
      if (momDelArm !== id) { momDelArm = id; render(); setTimeout(() => { if (momDelArm === id) { momDelArm = ''; if (root.isConnected) render(); } }, 6000); return; }
      const m = D.meetings.find(x => x.id === id);
      D.meetings = D.meetings.filter(x => x.id !== id); D.log = D.log.filter(l => l.meetingId !== id); Mom.delFile(id); momDelArm = '';
      save(); momBusy = `Deleted ${m ? m.ref : 'meeting'} and its log items. PCOs it created were kept; remove them on the Risks & changes tab if needed.`; render(); return;
    }
    if (a === 'export') {
      const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' }), l = document.createElement('a');
      l.href = URL.createObjectURL(blob); l.download = (String(D.project.name || 'project').replace(/[^\w-]+/g, '-').toLowerCase()) + '-dashboard.json'; document.body.appendChild(l); l.click(); l.remove();
      msg('settings', 'Exported. Keep the file safe; import it on any computer.');
    } else if (a === 'reset') { D = sample(); save(); render(); msg('settings', 'Sample data restored.'); }
    else if (a === 'clear') { D = { project: { name: 'My project', currency: D.project.currency, contract: 0, retention: 5, dataDate: new Date().toISOString().slice(0, 10) } }; for (const k of Object.keys(SCHEMA)) D[k] = []; save(); render(); msg('settings', 'Blank project started. Begin with the WBS baseline on the Schedule & progress tab.'); }
  }
  function onSubmit(e) {
    const np = e.target.closest('[data-form="newp"]');
    if (np) {
      e.preventDefault(); const fd = new FormData(np), name = String(fd.get('name') || '').trim() || 'New project';
      D = fd.get('start') === 'sample' ? Object.assign(sample(), {}) : blank(name, String(fd.get('currency') || 'AED'));
      D.project.name = name; D.project.currency = String(fd.get('currency') || D.project.currency);
      projId = newId(); showNew = false; pending = null; queue = []; save(); tab = 'schedule'; render();
      const m = root.querySelector('[data-msg="proj"]'); if (m) m.textContent = `Created "${name}". Start with the WBS baseline below, then milestones and progress.`;
      return;
    }
    const f = e.target.closest('[data-form="log"]'); if (!f) return;
    e.preventDefault();
    const fd = new FormData(f), code = fd.get('code'), date = fd.get('date');
    let p = fd.get('pct'); if (p === 'other') p = fd.get('custom');
    p = Math.max(0, Math.min(100, num(p)));
    if (!code || !date) return msg('log', 'Choose a WBS element and a date.');
    const ex = D.progress.find(x => String(x.code) === String(code) && x.date === date);
    if (ex) ex.pct = p; else D.progress.push({ date, code, pct: p });
    D.progress.sort((a, b) => dt(a.date) - dt(b.date) || String(a.code).localeCompare(String(b.code)));
    save(); render(); msg('log', `Logged ${wbsLabel(code)} at ${p}% on ${fmtD(date)}.`);
  }
  function onToggle(e) { const d = e.target; if (d.dataset && d.dataset.ed) { d.open ? openEd.add(d.dataset.ed) : openEd.delete(d.dataset.ed); } }

  return {
    mount(el) {
      root = el; D = load(); syncContract();
      el.addEventListener('input', onInput); el.addEventListener('change', onChange); el.addEventListener('click', onClick);
      el.addEventListener('submit', onSubmit); el.addEventListener('toggle', onToggle, true);
      el.addEventListener('dragover', e => { const z = e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
      el.addEventListener('dragleave', e => { const z = e.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
      el.addEventListener('dragover', e => { const z = e.target.closest('[data-drop-kind]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
      el.addEventListener('drop', e => { const k = e.target.closest('[data-drop-kind]'); if (k) { e.preventDefault(); k.classList.remove('over'); if (k.dataset.dropKind === 'ipc') { processIpcFiles([...e.dataTransfer.files]); return; } if (k.dataset.dropKind === 'inv') { processInvFiles([...e.dataTransfer.files]); return; } if (e.dataTransfer.files[0]) processDoc(k.dataset.dropKind, e.dataTransfer.files[0]); return; } });
      el.addEventListener('drop', e => { const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.remove('over'); if (e.dataTransfer.files.length) { queue.push(...e.dataTransfer.files); processNext(); setMomMsg(); } });
      render();
    },
    unmount() { ros.forEach(r => r.disconnect()); ros = []; },
  };
})();

</script>
<script>{ Dash.mount(document.getElementById('dash')); }</script>
